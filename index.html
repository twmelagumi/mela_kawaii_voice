<script>(function(){try{var v=localStorage.getItem("mela-theme");if(v==="dark"||v==="light")document.documentElement.dataset.theme=v}catch(e){}})()</script>

<style>
/* ===== 首頁（總覽） ===== */
.hm-news,.hm-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.hm-news{display:flex;flex-direction:column;gap:8px}
.hm-news h2,.hm-card h2{margin:0;font-family:var(--f-display);font-size:16px}
.hm-news ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hm-news li{display:flex;gap:12px;align-items:baseline;font-size:14px;line-height:1.6}
.hm-news time{flex:none;font-family:var(--f-code);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.hm-news a{color:var(--accent-text)}
.hm-news .more{align-self:flex-start;font-size:12px;padding:4px 12px}
.hm-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hm-card{display:flex;flex-direction:column;gap:10px;min-width:0}
.hm-card .kick{font-size:12px;color:var(--muted);margin:-6px 0 0}
.hm-t{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(18px,4.5vw,22px);line-height:1.4;text-wrap:pretty;overflow-wrap:anywhere}
.hm-s{margin:0;font-size:13px;color:var(--muted);line-height:1.7;overflow-wrap:anywhere}
.hm-tags{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--accent-text)}
.hm-play{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.hm-thumb{position:relative;display:block;width:100%;padding:0;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--line)}
.hm-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .25s,opacity .2s}
.hm-thumb:hover img{transform:scale(1.03);opacity:.9}
.hm-thumb .pl{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;padding-left:4px}
.hm-play iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.hm-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:4px}
.hm-acts .btn,.hm-acts button{font-size:13px;padding:7px 14px}
.hm-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.hm-list li{display:flex;gap:10px;align-items:flex-start;min-width:0}
.hm-list .d{flex:none;min-width:5.4em;font-family:var(--f-code);font-size:12px;color:var(--muted);line-height:1.7;font-variant-numeric:tabular-nums}
.hm-list .b{min-width:0;font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.hm-list a{color:inherit}
.hm-list img{flex:none;width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--bg);border:1px solid var(--line)}
.hm-list img.yt{width:112px;height:63px;border-radius:8px}
.hm-badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;border:1px solid var(--accent);color:var(--accent-text);margin-right:6px;vertical-align:1px}
.hm-badge.live{border-color:#ff3b5c;color:#e0284a}
.hm-sub{font-size:12px;color:var(--muted);margin:2px 0 -4px}
@media (max-width:640px){.hm-grid{grid-template-columns:1fr}}
</style>
</head>

<script src="assets/common.js?v=18250fa9"></script>
<script src="assets/sync.js?v=28ae5e17"></script><!-- 標題列的登入按鈕（每頁都有） -->
<script src="assets/clips.js?v=5f3ac17c"></script><!-- 回音片段資料（clips.json＋試算表），回音頁也用 -->
<script src="assets/collect.js?v=3b84e306"></script><!-- 試算表讀取（含快取）、網址／日期小工具，周邊頁也用 -->
<script src="assets/timeline-data.js?v=757eb4c8"></script><!-- 出勤紀錄資料（三個來源合併），出勤紀錄／月曆頁也用 -->
<script>
/* ===== 首頁（總覽） =====
 * 五塊內容，各自讀資料、讀失敗只影響那一塊：
 *   網站更新      news.json（每次改版時加一筆，新的放最前面：{date, zh, ja, en, url?}）
 *   回音推薦      assets/clips.js（clips.json＋試算表）→ 每天（日本時間 5:00 換日）挑一則，大家一樣；可以直接在卡片上播放
 *   歌單推薦      songs.json → 每天一首（和每日簽到的「今日推薦歌」是同一首）
 *   出勤紀錄／直播預定  assets/timeline-data.js → 即將開始（或正在播）的直播；沒有預定就顯示最近一場
 *   近期發售周邊   Google 試算表「周邊頁紀錄」分頁（和周邊頁同一份，快取也共用）→ 日期在今天以後的企劃；沒有就顯示最近發售的
 */
addStrings({
 zh:{hmSub:"熱千めら（アソビ★まわり隊！）的非官方粉絲網站：回音、歌單、出勤紀錄、周邊和小遊戲都在這裡。",
   hmNews:"網站更新",hmNewsMore:"更多更新",hmNewsLess:"收合",hmLoading:"讀取中…",hmFail:"暫時讀不到資料，請稍後再試。",
   hmClip:"回音推薦",hmSong:"歌單推薦",hmShift:"出勤紀錄／直播預定",hmGoods:"近期發售周邊",hmDaily:"每天日本時間 5:00 更換",
   hmPlay:"▶ 播放",hmOpenSrc:"開啟原文 ↗",hmYt:"在 YouTube 開啟 ↗",hmMoreClips:"更多回音 →",hmMoreSongs:"歌單 →",hmMoreShift:"出勤紀錄 →",hmMoreGoods:"周邊 →",hmCalendar:"月曆 →",
   hmUpcoming:"預定",hmLive:"直播中",hmLatest:"最近一場",hmNoShift:"目前沒有預定的直播。",hmGoodsRecent:"目前沒有預定發售的周邊，以下是最近發售的。",hmGoodsNone:"還沒有周邊資料。",hmShop:"官方商店 ↗",hmNew:"新",hmEmpty:"還沒有資料。"},
 ja:{hmSub:"熱千めら（アソビ★まわり隊！）の非公式ファンサイト。こだま・歌リスト・出勤記録・グッズ・ミニゲームをまとめてチェック。",
   hmNews:"サイトの更新",hmNewsMore:"過去の更新",hmNewsLess:"閉じる",hmLoading:"読み込み中…",hmFail:"データを読み込めませんでした。しばらくしてからお試しください。",
   hmClip:"おすすめのこだま",hmSong:"おすすめの曲",hmShift:"出勤記録／配信予定",hmGoods:"もうすぐ発売のグッズ",hmDaily:"毎日 日本時間 5:00 に更新",
   hmPlay:"▶ 再生",hmOpenSrc:"元の投稿を開く ↗",hmYt:"YouTube で開く ↗",hmMoreClips:"こだま一覧 →",hmMoreSongs:"歌リスト →",hmMoreShift:"出勤記録 →",hmMoreGoods:"グッズ →",hmCalendar:"カレンダー →",
   hmUpcoming:"予定",hmLive:"配信中",hmLatest:"直近の配信",hmNoShift:"予定されている配信はありません。",hmGoodsRecent:"発売予定のグッズはありません。直近の発売分を表示しています。",hmGoodsNone:"グッズのデータがありません。",hmShop:"公式ショップ ↗",hmNew:"NEW",hmEmpty:"データがありません。"},
 en:{hmSub:"An unofficial fan site for Achichi Mela (Asobi★Mawari-tai!): echoes, songs, shift log, goods and mini-games in one place.",
   hmNews:"Site updates",hmNewsMore:"Older updates",hmNewsLess:"Show less",hmLoading:"Loading…",hmFail:"Couldn't load the data. Please try again later.",
   hmClip:"Echo of the day",hmSong:"Song of the day",hmShift:"Shift log / upcoming streams",hmGoods:"Coming-soon goods",hmDaily:"Changes daily at 5:00 AM Japan time",
   hmPlay:"▶ Play",hmOpenSrc:"Open original ↗",hmYt:"Open on YouTube ↗",hmMoreClips:"All echoes →",hmMoreSongs:"Song list →",hmMoreShift:"Shift log →",hmMoreGoods:"Goods →",hmCalendar:"Calendar →",
   hmUpcoming:"Upcoming",hmLive:"Live",hmLatest:"Latest stream",hmNoShift:"No streams scheduled right now.",hmGoodsRecent:"Nothing is scheduled to release. Here are the most recent releases.",hmGoodsNone:"No goods data yet.",hmShop:"Official shop ↗",hmNew:"NEW",hmEmpty:"No data yet."}
});
const tq=(k,o)=>t(k).replace(/\{(\w)\}/g,(_,x)=>o[x]??"");
const L=v=>v==null?"":typeof v==="string"?v:(v[lang]||v.zh||v.ja||Object.values(v).find(Boolean)||"");
const safeUrl=u=>{ if(!u||!String(u).trim()) return ""; try{ const x=new URL(String(u||"").trim(),location.href); return /^https?:$/.test(x.protocol)?x.href:""; }catch(e){ return ""; } };
const LOC={zh:"zh-Hant",ja:"ja",en:"en"};
const NEWS_SHOW=3;
// 各塊的狀態：undefined＝讀取中、null＝讀失敗、其他＝資料
let NEWS, CLIP, SONG, SHIFT, GOODS, newsAll=false;

const loading=()=>`<p class="hm-s">${t("hmLoading")}</p>`;
const fail=()=>`<p class="hm-s">${t("hmFail")}</p>`;
const head=(k,sub)=>`<h2>${t(k)}</h2>${sub?`<p class="kick">${t(sub)}</p>`:""}`;
// 在卡片上直接播放（YouTube 內嵌播放器；按了才載入）
const embedSrc=(vid,s,e)=>`https://www.youtube-nocookie.com/embed/${encodeURIComponent(vid)}?autoplay=1&rel=0&playsinline=1${s!=null?"&start="+Math.floor(s):""}${e!=null?"&end="+Math.ceil(e):""}`;
const ytUrl=(vid,s)=>`https://www.youtube.com/watch?v=${encodeURIComponent(vid)}${s!=null?"&t="+Math.floor(s)+"s":""}`;
const ytThumb=vid=>`https://i.ytimg.com/vi/${encodeURIComponent(vid)}/mqdefault.jpg`;
// YouTube のサムネ（押すとその場で再生）。画像は YouTube から読み込む（回音頁と同じ）
const thumbBtn=(vid,s,e,label)=>`<button type="button" class="hm-thumb" data-play="1" data-vid="${esc(vid)}" data-s="${s??""}" data-e="${e??""}" aria-label="${t("hmPlay")}: ${esc(label)}"><img src="${ytThumb(vid)}" alt="" loading="lazy" decoding="async"><span class="pl" aria-hidden="true">▶</span></button>`;

function renderNews(){ const el=$("hmNews"); if(NEWS===undefined){ el.innerHTML=head("hmNews")+loading(); return; }
  if(!NEWS||!NEWS.length){ el.hidden=true; return; } el.hidden=false;
  const list=newsAll?NEWS:NEWS.slice(0,NEWS_SHOW), first=NEWS[0]&&NEWS[0].date;
  el.innerHTML=head("hmNews")+`<ul>${list.map(n=>{ const u=safeUrl(n.url), txt=esc(L(n)); // L(n)：取 n.zh／ja／en
    return `<li><time datetime="${esc(n.date)}">${esc(String(n.date).replace(/-/g,"."))}</time><span>${u?`<a href="${esc(u)}">${txt}</a>`:txt}</span></li>`; }).join("")}</ul>`
    +(NEWS.length>NEWS_SHOW?`<button type="button" class="more" id="newsToggle">${t(newsAll?"hmNewsLess":"hmNewsMore")}</button>`:""); }

function renderClip(){ const el=$("hmClip"); if(CLIP===undefined) return void(el.innerHTML=head("hmClip","hmDaily")+loading()); if(CLIP===null) return void(el.innerHTML=head("hmClip")+fail());
  if(!CLIP.c) return void(el.innerHTML=head("hmClip")+`<p class="hm-s">${t("hmEmpty")}</p>`);
  const c=CLIP.c, yt=c.src==="youtube"&&c.vid;
  el.innerHTML=head("hmClip","hmDaily")+(yt?thumbBtn(c.vid,c.start,c.end,c.title):"")+`<p class="hm-t">${esc(c.title)}</p>`
    +(c.quote?`<p class="hm-s">「${esc(c.quote)}」</p>`:"")+(c.note?`<p class="hm-s">${esc(c.note)}</p>`:"")
    +((c.tags||[]).length?`<div class="hm-tags">${c.tags.slice(0,5).map(x=>`<span>#${esc(x)}</span>`).join("")}</div>`:"")
    +`<div class="hm-acts">${yt?"":`<a class="btn primary" href="${esc(safeUrl(c.url))}" target="_blank" rel="noopener">${t("hmOpenSrc")}</a>`}<a class="btn" href="voices.html">${t("hmMoreClips")}</a></div>`; }

function renderSong(){ const el=$("hmSong"); if(SONG===undefined) return void(el.innerHTML=head("hmSong","hmDaily")+loading()); if(SONG===null) return void(el.innerHTML=head("hmSong")+fail());
  if(!SONG.s) return void(el.innerHTML=head("hmSong")+`<p class="hm-s">${t("hmEmpty")}</p>`);
  const s=SONG.s;
  el.innerHTML=head("hmSong","hmDaily")+thumbBtn(s.vid,s.start,null,s.title)+`<p class="hm-t">${esc(s.title)}</p>`+(s.artist?`<p class="hm-s">${esc(s.artist)}</p>`:"")+(s.note?`<p class="hm-s">${esc(s.note)}</p>`:"")
    +`<div class="hm-acts"><a class="btn primary" href="${esc(ytUrl(s.vid,s.start))}" target="_blank" rel="noopener">${t("hmYt")}</a><a class="btn" href="songs.html">${t("hmMoreSongs")}</a></div>`; }

const fmtWhen=e=>{ if(e.start){ const d=new Date(e.start); if(!isNaN(d)) return d.toLocaleString(LOC[lang],{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}); }
  return String(e.date||"").slice(5).replace("-","/"); };
function renderShift(){ const el=$("hmShift"); if(SHIFT===undefined) return void(el.innerHTML=head("hmShift")+loading()); if(SHIFT===null) return void(el.innerHTML=head("hmShift")+fail());
  const now=Date.now();
  const row=(e,badge)=>{ const u=safeUrl(e.url), txt=esc(e.title||""), vid=vidOf(e.url); return `<li>${vid?`<a href="${esc(u)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true"><img class="yt" src="${esc(ytThumb(vid))}" alt="" width="112" height="63" loading="lazy" decoding="async"></a>`:""}<div style="min-width:0"><span class="d" style="display:block">${esc(fmtWhen(e))}</span></span><span class="b">${badge||""}${u?`<a href="${esc(u)}" target="_blank" rel="noopener">${txt}</a>`:txt}</span></div></li>`; };
  let body;
  if(SHIFT.up.length) body=`<ul class="hm-list">${SHIFT.up.map(e=>row(e,e.start&&new Date(e.start).getTime()<=now?`<span class="hm-badge live">${t("hmLive")}</span>`:`<span class="hm-badge">${t("hmUpcoming")}</span>`)).join("")}</ul>`;
  else body=`<p class="hm-s">${t("hmNoShift")}</p>`+(SHIFT.last?`<p class="hm-sub">${t("hmLatest")}</p><ul class="hm-list">${row(SHIFT.last)}</ul>`:"");
  el.innerHTML=head("hmShift")+body+`<div class="hm-acts"><a class="btn" href="timeline.html">${t("hmMoreShift")}</a><a class="btn" href="calendar.html">${t("hmCalendar")}</a></div>`; }

function renderGoods(){ const el=$("hmGoods"); if(GOODS===undefined) return void(el.innerHTML=head("hmGoods")+loading()); if(GOODS===null) return void(el.innerHTML=head("hmGoods")+fail());
  if(!GOODS.list.length) return void(el.innerHTML=head("hmGoods")+`<p class="hm-s">${t("hmGoodsNone")}</p><div class="hm-acts"><a class="btn" href="goods.html">${t("hmMoreGoods")}</a></div>`);
  const row=g=>`<li>${g.cover?`<img src="${esc(g.cover)}" alt="" width="56" height="56" loading="lazy" decoding="async">`:""}<div class="b"><span class="d" style="display:block;min-width:0">${esc(fmtDate(g.date))}</span>${esc(g.name)}${g.shop?` <a href="${esc(g.shop)}" target="_blank" rel="noopener" style="color:var(--accent-text);font-size:12px">${t("hmShop")}</a>`:""}</div></li>`;
  el.innerHTML=head("hmGoods")+(GOODS.upcoming?"":`<p class="hm-s">${t("hmGoodsRecent")}</p>`)+`<ul class="hm-list">${GOODS.list.map(row).join("")}</ul><div class="hm-acts"><a class="btn" href="goods.html">${t("hmMoreGoods")}</a></div>`; }

function render(){ renderNews(); renderClip(); renderSong(); renderShift(); renderGoods(); }
window.onLangChange=()=>render();

document.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return;
  if(b.id==="newsToggle"){ newsAll=!newsAll; return renderNews(); }
  if(b.dataset.play){ const s=b.dataset.s===""?null:+b.dataset.s, en=b.dataset.e===""?null:+b.dataset.e;
    const player=document.createElement("div"); player.className="hm-play";
    player.innerHTML=`<iframe src="${esc(embedSrc(b.dataset.vid,s,en))}" title="YouTube" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
    b.replaceWith(player); } });

/* ===== 讀資料 ===== */
const day=jstDay();
const loadNews=async()=>{ try{ const r=await fetch("news.json",{cache:"no-cache"}); if(!r.ok) throw new Error("HTTP "+r.status); const d=await r.json();
  NEWS=(Array.isArray(d)?d:[]).filter(n=>n&&n.date&&(n.zh||n.ja||n.en)).sort((a,b)=>String(b.date).localeCompare(String(a.date))); }catch(e){ console.warn("news failed",e); NEWS=null; } renderNews(); };
const pickClip=list=>({c:pickOfDay(list.filter(c=>c&&c.title),"clip",day)});
const loadClip=async()=>{ try{ CLIP=pickClip(await MelaClips.load(l=>{ CLIP=pickClip(l); renderClip(); })); }catch(e){ console.warn("clips failed",e); CLIP=null; } renderClip(); };
const loadSong=async()=>{ try{ SONG={s:pickOfDay(await loadSongList(),"song",day)}; }catch(e){ console.warn("song failed",e); SONG=null; } renderSong(); };
const loadShift=async()=>{ try{ const {raw}=await loadTimeline(), ev=raw.filter(e=>e&&e.title);
    const at=e=>e.start?new Date(e.start).getTime():new Date((e.date||"")+"T12:00:00").getTime();
    const up=ev.filter(e=>e.upcoming).sort((a,b)=>at(a)-at(b)).slice(0,3);
    const today=new Date(), td=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
    const past=ev.filter(e=>!e.upcoming&&(e.type||"stream")==="stream"&&e.date&&normDate(e.date)<=td).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    SHIFT={up,last:past[0]||null}; }catch(e){ console.warn("shift failed",e); SHIFT=null; } renderShift(); };

// 周邊：欄位依第一列標題認（和 goods.html 的 GCOLS 同一套，只取首頁要用的）。試算表網址要和 goods.html 的 GOODS_CSV_URL 一樣
const GOODS_CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQIjhyIETZ-Ky_Nydc7RRi81T3SxLzJ0tROU5xJC9pYiPma7MWY4qhWxRoD9CQZVaPB6q00znizevlf/pub?gid=1311668276&single=true&output=csv";
const GCOLS=[["code",/project\s*code|企劃代號|コード/i],["pname",/project\s*name|企劃名|企画名/i],["date",/date|日期|日付|発売/i],["shop",/official|website|shop|商店|ショップ/i],["name",/goods\s*name|品名|商品名/i],["image",/picture|image|圖片|画像/i]];
const imgUrl=u=>{ u=String(u||"").trim(); return /^(assets\/goods\/)[\w\-.%]+\.(webp|png|jpe?g|gif|avif)$/i.test(u)?u:webUrl(u); };
function buildGoods(text){ const rows=parseCSV(text||""); if(!rows.length) return {list:[],upcoming:false};
  const col={}; rows[0].forEach((h,i)=>{ const k=GCOLS.find(([k])=>col[k]==null&&GCOLS.find(x=>x[0]===k)[1].test(String(h).trim())); if(k) col[k[0]]=i; });
  const get=(r,k)=>col[k]==null?"":String(r[col[k]]??"").trim();
  const map=new Map(); let cur=null;
  for(const r of rows.slice(1)){ const code=get(r,"code"), pname=get(r,"pname");
    if(code||pname){ const key=code||pname; if(!map.has(key)) map.set(key,{name:pname||code,date:null,shop:"",cover:"",n:0}); cur=map.get(key);
      if(pname) cur.name=pname; const d=normDate(get(r,"date")); if(d) cur.date=d; cur.shop=webUrl(get(r,"shop"))||cur.shop; }
    if(!cur) continue;
    const img=imgUrl(get(r,"image")); if(!get(r,"name")){ if(img) cur.cover=smallImg(img); } else { cur.n++; if(!cur.cover&&img) cur.cover=smallImg(img); } } // 沒有品名的列＝企劃資料（圖片＝企劃封面）
  const now=new Date(), td=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
  const all=[...map.values()].filter(g=>g.n&&g.date), up=all.filter(g=>g.date>=td).sort((a,b)=>a.date.localeCompare(b.date));
  if(up.length) return {list:up.slice(0,3),upcoming:true};
  return {list:all.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,2),upcoming:false}; }
const loadGoods=()=>new Promise(res=>{ try{ MelaCollect.loadSheet({url:GOODS_CSV_URL,key:"mela-goods-csv",ttl:5*60*1000},
    text=>{ try{ GOODS=buildGoods(text); }catch(e){ console.warn("goods failed",e); GOODS=null; } renderGoods(); res(); },
    text=>{ try{ GOODS=buildGoods(text); renderGoods(); }catch(e){} }); }catch(e){ console.warn("goods failed",e); GOODS=null; renderGoods(); res(); } });

setLang(pickLang());
render();
loadNews(); loadClip(); loadSong(); loadShift(); loadGoods();
</script>
