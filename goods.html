<style>
/* ===== 周邊頁 ===== */
.view{gap:10px}
.g-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.g-tools .sp{flex:1}
.g-search{width:100%;box-sizing:border-box;font:inherit;font-size:15px;padding:11px 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink)}
.g-search:focus{outline:2px solid var(--accent);outline-offset:1px}
.g-frow{gap:6px 10px;align-items:flex-start}
.g-frow .chips-label{padding-top:6px;min-width:2.5em}
.g-sel{gap:8px 14px}
.g-sel label{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.g-notice{margin:0;font-size:12px;color:var(--muted);line-height:1.6}
/* 已入手的說明＋備份（匯出／匯入） */
.g-bk-msg{margin:0;font-size:12px}
.g-bk-msg.ok{color:var(--accent-text)}
.g-bk-msg.err{color:#d93d42}
.g-list{display:flex;flex-direction:column;gap:30px}
.g-list{gap:16px!important;margin-top:6px}
.g-series{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.g-series.open{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.g-head{display:grid;grid-template-columns:240px minmax(0,1fr);gap:14px 18px;align-items:center}
@media (max-width:600px){.g-head{grid-template-columns:1fr}}
.g-cover{position:relative;display:block;width:100%;aspect-ratio:16/9;padding:0;border:none;border-radius:10px;overflow:hidden;background:var(--bg);cursor:pointer}
.g-cover img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .25s}
.g-cover:hover img{transform:scale(1.03)}
.g-cover .g-ph{border-radius:10px}
.g-info{display:flex;flex-direction:column;gap:8px;min-width:0}
.g-tgl{all:unset;cursor:pointer;display:flex;align-items:flex-start;gap:8px;border-radius:6px}
.g-tgl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.g-tgl:hover h2{color:var(--accent-text)}
.g-chev{flex:none;margin-top:6px;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;color:var(--muted);transition:transform .2s}
.g-series.open .g-chev{transform:rotate(180deg)}
.g-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.g-series>.g-grid,.g-series>.g-post{padding-top:12px;border-top:1px solid var(--line)}
.g-head .g-ttl{min-width:0}
.g-date{font-family:var(--f-code);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.g-head h2{margin:0;font-family:var(--f-display);font-weight:900;font-size:22px;line-height:1.3;overflow-wrap:anywhere}
.g-head .g-note{margin:4px 0 0;font-size:13px;color:var(--muted);white-space:pre-line}
.g-links{display:flex;flex-wrap:wrap;gap:8px}
.g-links a{font-size:12px;padding:5px 12px}
.g-prog{display:flex;align-items:center;gap:8px;font-family:var(--f-code);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.g-prog i{display:block;width:72px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.g-prog i b{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.g-prog.full{color:var(--accent-text)}
.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
@media (max-width:520px){.g-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.g-card{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0;transition:border-color .15s,box-shadow .15s}
.g-card.have{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.g-img{position:relative;display:block;aspect-ratio:1;background:var(--bg);overflow:hidden}
.g-img img{width:100%;height:100%;object-fit:contain;display:block}
.g-ph{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:6px;color:var(--muted);font-size:12px;
  background:radial-gradient(circle at 30% 25%,var(--accent-soft),transparent 60%),var(--bg)}
.g-ph svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.6;opacity:.7}
.g-badge{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.25);transform:scale(0);transition:transform .2s}
.g-card.have .g-badge{transform:scale(1)}
.g-body{display:flex;flex-direction:column;gap:6px;padding:10px 12px 12px;flex:1;min-width:0}
.g-ovs{background:#ffe9d6!important;color:#b5520f!important}
@media (prefers-color-scheme:dark){.g-ovs{background:#3a2616!important;color:#ffaa70!important}}
.g-type{align-self:flex-start;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent-text)}
.g-body h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.4;overflow-wrap:anywhere}
.g-body .g-note{margin:0;font-size:12px;color:var(--muted);white-space:pre-line;overflow-wrap:anywhere}
.g-body .g-links{margin-top:2px}
.g-body .g-links a{font-size:11px;padding:3px 10px}
.g-have{margin-top:auto;justify-content:center;font-size:13px;padding:6px 10px}
.g-qty{margin-top:auto;display:flex;align-items:center;gap:6px}
.g-qty .g-have{margin-top:0;flex:1;min-width:0;white-space:nowrap}
.g-qty .g-step{flex:none;width:30px;height:30px;padding:0;justify-content:center;font-size:17px;font-weight:700;line-height:1}
.g-have .g-n{font-family:var(--f-code);font-weight:600}
/* 卡片太窄時（大部分情況）中間只顯示「✓ ×數量」，文字留在 title／aria-label */
.g-card{container-type:inline-size}
.g-qty .g-n1{display:none}
@container (max-width:230px){ .g-qty .g-lbl{display:none} .g-qty .g-n1{display:inline} }
.g-have[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.g-total b{transition:color .2s}
/* 花費總金額：預設隱藏數字，按一下顯示 */
.g-spend{padding:4px 12px;font-size:13px;gap:6px;background:var(--surface)}
.g-spend b{font-size:16px!important;font-weight:600;color:var(--ink);letter-spacing:.02em}
.g-spend[aria-pressed="false"] b{color:var(--muted);letter-spacing:.12em}
.g-spend small{font-size:11px;color:var(--muted)}
.g-spend-note{flex-basis:100%;margin:-4px 0 0;font-size:11px;line-height:1.6;color:var(--muted);text-align:right}
@media (max-width:600px){.g-spend-note{text-align:left}}
body.scrolled .g-spend-note{display:none}
/* 企劃清單：一次 10 個，「顯示更多」 */
.g-more{align-self:center;margin-top:4px;font-size:14px;padding:9px 22px}
/* 宣傳推文嵌入 */
.g-links button{font-size:12px;padding:5px 12px}
.g-post{max-width:550px;min-height:60px}
.g-post .twitter-tweet{margin:0!important}
</style>

<script>
/* ===== 周邊頁 =====
 * 資料來源：Google 試算表「周邊頁紀錄」分頁（GOODS_CSV_URL），欄位依第一列標題認：
 *   goods project code（企劃代號，英文）／goods project name（企劃名稱）／date（日期）／goods official website（官方商店）
 *   x link（推文）／goods name（品名）／goods picture（圖片網址）／note（商品說明）／project note（企劃說明）／oversea（海外合作）
 * - 企劃的資料（名稱、日期、官方商店、企劃說明、oversea）只要填在該企劃的第一列；
 *   下面的商品列 goods project code 可以留空 → 算是上一個企劃的商品（所以試算表不要排序，新企劃加在最下面）
 * - x link：只有企劃第一列有填 → 企劃的宣傳推文（標題旁「顯示宣傳推文」）；企劃裡其他列也有填 → 每一列是該商品自己的推文（例如各店家特典）
 * - oversea 打勾（或填 v、1、是）：填在企劃第一列＝整個企劃是海外合作；只填在某個商品列＝只有那個商品
 * - 企劃第一列（goods name 空白）的 goods picture＝企劃封面。頁面一開始只顯示企劃（封面＋標題），點封面或標題才展開商品卡片、讀商品圖片
 * - goods picture 也可以填網站裡的圖片路徑 assets/goods/檔名.webp（自己縮小過的圖，例如新聞稿素材，寬 800px 左右）
 * - goods picture 可留空：顯示預設圖示。官方商店（shop.hololivepro.com/cdn/）的圖片會自動加 width=600 讀小張的
 * - 「已入手」用「企劃代號|品名」辨識：改了代號或品名，大家勾過的紀錄就會不見
 * 「已入手」只存在瀏覽者自己的瀏覽器（localStorage），換瀏覽器或清除資料就會不見。
 *   頁面上有「匯出備份」（下載 mela-goods-backup-日期.json：{site:"mela-goods",version:2,exported,have:{id:數量}}）和「匯入備份」（合併，數量取較多的，不會取消原本的勾選；也讀得懂 version 1 的 id 陣列）。
 * - 已入手可以記數量：入手後按鈕兩邊有 −／＋（減到 0＝取消已入手）
 * - price（金額，日圓）欄會讀進來（「¥1,980」也可以）：每個商品不顯示金額，只用來算頁首的「花費」（已入手的 金額×數量，預設隱藏，按一下顯示）
 *   金額＝日圓定價估算（不含運費等雜費）；非日圓計價的商品，price 填「發售當時匯率換算後的日圓」。顯示金額時頁首會出現這段註記（spendNote）
 * - 企劃一次顯示 PAGE（10）個，下面「顯示更多」再加 10 個
 */
// Google 試算表「周邊頁紀錄」分頁發佈成 CSV 的網址
const GOODS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQIjhyIETZ-Ky_Nydc7RRi81T3SxLzJ0tROU5xJC9pYiPma7MWY4qhWxRoD9CQZVaPB6q00znizevlf/pub?gid=1311668276&single=true&output=csv";
const GOODS_TTL = 5*60*1000, GOODS_KEY = "mela-goods-csv"; // 試算表在訪客瀏覽器快取 5 分鐘
addStrings({
 zh:{titleGoods:"めら組繳稅簿",subGoods:"熱千めら 出過的官方周邊。勾選已入手的，整理自己的收藏。",
   haveLabel:"已入手",tpLabel:"種類",tpAll:"全部",srchPh:"搜尋企劃或周邊名稱…",catLabel:"企劃",cat_anniversary:"周年紀念",cat_birthday:"生日紀念",cat_oversea:"海外合作",cat_other:"其他",yearLabel:"年份",statusLabel:"狀態",sortLabel:"排序",emptyMatch:"沒有符合的周邊",tp_badge:"徽章",tp_acrylic_stand:"壓克力立牌",tp_keychain:"吊飾",tp_plushie:"娃娃",fAll:"全部",fHave:"已入手",fNot:"未入手",newFirst:"新 → 舊",oldFirst:"舊 → 新",
   shop:"官方商店",post:"宣傳推文",markHave:"標記已入手",spendLabel:"花費",spendNote:"※花費金額是用商品的日圓定價估算，不包含運費等其他雜費；非日圓計價的商品，以發售當時的匯率換算成日圓估算。",spendShow:"按一下顯示／隱藏金額",spendMiss:"（未含 {n} 件沒有金額的）",moreSeries:"顯示更多（還有 {n} 個企劃）",isHave:"✓ 已入手",qtyDec:"數量減一",qtyInc:"數量加一",unmark:"取消已入手",noImage:"沒有圖片",oversea:"海外合作",xPost:"推文",showPost:"顯示宣傳推文",hidePost:"收起推文",
   goodsNotice:"本站不販售任何商品，購買請到官方商店。圖片 Ⓒ COVER。",
   haveNotice:"「已入手」只存在這台裝置的這個瀏覽器裡：換瀏覽器、換手機或電腦、使用無痕模式，或清除瀏覽紀錄／網站資料（Cookie）後都會不見。建議不時按「匯出備份」存一份檔案，之後可以用「匯入備份」還原，也能用來搬到其他裝置。",
   bkExport:"匯出備份",bkImport:"匯入備份",bkExported:"已下載備份檔（{n} 項）。",bkImported:"已匯入：備份裡 {n} 項，新增或更新 {m} 項（數量取兩邊較多的，原本勾的不會被取消）。",bkBad:"這不是本站的備份檔，或檔案損壞。",bkEmpty:"目前沒有勾選任何已入手，不需要備份。",
   empty:"還沒有周邊資料",emptyHave:"還沒有勾選已入手的周邊",emptyNot:"全部都入手了！"},
 ja:{titleGoods:"めらめらグッズ記録",subGoods:"熱千めらの公式グッズの記録。持っているものにチェックして、コレクションを整理できます。",

const HAVE_KEY="mela-goods-have";
let series=[], have=new Map(), filter="all", tfilter="all", cfilter="all", yfilter="all", query="", order="desc", showSpend=false; // showSpend：花費金額是否顯示（每次開頁面都先隱藏）
const PAGE=10; let limit=PAGE; // 企劃一次顯示 10 個 // have：商品 id → 入手數量（1 以上）
const openPosts=new Set(); // 已展開宣傳推文的企劃
const openSeries=new Set(); // 已展開的企劃（展開後才產生商品卡片、才讀商品圖片）
const isXPost=u=>/^https:\/\/(x|twitter)\.com\/[^/]+\/status\/\d+/.test(u||"");
// X 網址整理成 https://x.com/帳號/status/ID（去掉 /photo/4、?s=20 等）
const cleanX=u=>{ const m=String(u||"").match(/^https?:\/\/(?:www\.|mobile\.)?(?:x|twitter)\.com\/([^/?#]+)\/status\/(\d+)/); return m?`https://x.com/${m[1]}/status/${m[2]}`:u; };
// 圖片網址：http(s) 網址，或網站裡的相對路徑（例：assets/goods/xxx.webp，放在 repo 的 assets/goods/ 資料夾）
const imgUrl=u=>{ u=String(u||"").trim(); return /^(assets\/goods\/)[\w\-.%]+\.(webp|png|jpe?g|gif|avif)$/i.test(u)?u:goodUrl(u); };
// 官方商店的圖片讀小張一點
const smallImg=u=>{ try{ const x=new URL(u); if(x.hostname==="shop.hololivepro.com"&&x.pathname.startsWith("/cdn/")&&!x.searchParams.has("width")) x.searchParams.set("width","600"); return x.href; }catch(e){ return u; } };
// 舊格式是 id 陣列（數量當 1），新格式是 {id: 數量}
const toHave=d=>{ const m=new Map();
  if(Array.isArray(d)){ for(const id of d) if(typeof id==="string") m.set(id,1); }
  else if(d&&typeof d==="object"){ for(const [id,n] of Object.entries(d)){ const k=Math.floor(+n); if(k>=1) m.set(id,Math.min(k,999)); } }
  else return null; return m; };
try{ have=toHave(JSON.parse(localStorage.getItem(HAVE_KEY)||"{}"))||new Map(); }catch(e){}
try{ order=localStorage.getItem("mela-goods-order")||"desc"; }catch(e){}
const saveHave=()=>{ try{ localStorage.setItem(HAVE_KEY,JSON.stringify(Object.fromEntries(have))); }catch(e){} };
const goodUrl=u=>{ try{ const x=new URL(String(u||"").trim()); return /^https?:$/.test(x.protocol)?x.href:""; }catch(e){ return ""; } };
const fmtDate=d=>d?d.replace(/-/g,"."):"";
const bagSvg='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>';

// 試算表標題 → 欄位（依序比對，先比對到的優先）
const GCOLS=[["code",/project\s*code|企劃代號|コード/i],["pname",/project\s*name|企劃名|企画名/i],["pnote",/project\s*note|企劃說明|企画メモ/i],
  ["date",/date|日期|日付|発売/i],["shop",/official|website|shop|商店|ショップ/i],["post",/x\s*link|tweet|推文|ポスト|^x$/i],
  ["name",/goods\s*name|品名|商品名/i],["type",/goods\s*type|類型|类型|種類|タイプ|^type$/i],["image",/picture|image|圖片|画像/i],["oversea",/oversea|海外/i],["price",/price|金額|價格|価格|値段|定価/i],["note",/note|說明|備註|メモ/i]];
// CSV → 企劃
function build(text){
  const rows=parseCSV(text||""); if(!rows.length){ series=[]; return; }
  const col={}; rows[0].forEach((h,i)=>{ const k=GCOLS.find(([k,re])=>col[k]==null&&re.test(String(h).trim())); if(k) col[k[0]]=i; });
  const get=(r,k)=>col[k]==null?"":String(r[col[k]]??"").trim();
  const map=new Map(); let cur=null;
  for(const r of rows.slice(1)){
    const code=get(r,"code"), pname=get(r,"pname");
    if(code||pname){ const key=code||pname;
      if(!map.has(key)) map.set(key,{key,name:pname||code,cover:"",date:null,shop:"",post:"",note:"",oversea:false,items:[]});
      cur=map.get(key);
      if(pname) cur.name=pname; const d=normDate(get(r,"date")); if(d) cur.date=d;
      cur.shop=goodUrl(get(r,"shop"))||cur.shop; cur.note=get(r,"pnote")||cur.note; if(isYes(get(r,"oversea"))) cur.oversea=true; }
    if(!cur) continue;
    const name=get(r,"name"), post=goodUrl(cleanX(get(r,"post")));
    if(!name){ if(post) cur.post=post; const pt=get(r,"type").toLowerCase(); if(pt) cur.ptype=pt; const c=imgUrl(get(r,"image")); if(c) cur.cover=smallImg(c); continue; } // 沒有品名的列：企劃資料（goods picture＝企劃封面）
    const img=imgUrl(get(r,"image"));
    cur.items.push({id:`${cur.key}|${name}`,name,type:get(r,"type").toLowerCase().replace(/[\s_-]+/g," ").trim(),image:img?smallImg(img):"",post,shop:"",note:get(r,"note"),
      price:(v=>v?+v:null)(get(r,"price").replace(/[^\d.]/g,"")), // 金額（日圓）：先讀進來，頁面上還不顯示
      oversea:!(code||pname)&&isYes(get(r,"oversea"))});
  }
  for(const g of map.values()){ // x link 只有第一個商品有 → 算企劃的宣傳推文
    const withPost=g.items.filter(i=>i.post);
    if(!g.post&&withPost.length===1&&withPost[0]===g.items[0]){ g.post=g.items[0].post; g.items[0].post=""; } }
  for(const g of map.values()){ const p=g.ptype||""; g.cat=/anniv|周年|記念|纪念/.test(p)?"anniversary":/birth|生日|誕生/.test(p)?"birthday":g.oversea?"oversea":"other"; }
  series=[...map.values()].filter(g=>g.items.length);
}

function linksHTML(o){ return (o.shop||o.post)?`<div class="g-links">${o.shop?`<a class="btn" href="${esc(o.shop)}" target="_blank" rel="noopener">${t("shop")} ↗</a>`:""}${o.post?`<a class="btn" href="${esc(o.post)}" target="_blank" rel="noopener">${isXPost(o.post)?"X "+t("xPost"):t("post")} ↗</a>`:""}</div>`:""; }

// 花費總金額＝已入手商品的 金額 × 數量（沒有金額的另外算件數）
function updateSpend(){ let sum=0, miss=0;
  for(const g of series) for(const i of g.items){ const n=have.get(i.id)||0; if(!n) continue; if(i.price!=null) sum+=i.price*n; else miss++; }
  const b=$("spendBtn"); b.setAttribute("aria-pressed",showSpend); b.title=t("spendShow");
  $("spendV").textContent=showSpend?"¥"+sum.toLocaleString("ja-JP"):"¥ •••••";
  $("spendNote").hidden=!showSpend; // 金額的註記：顯示金額時才出現
  $("spendMiss").hidden=!(showSpend&&miss); $("spendMiss").textContent=miss?tfm("spendMiss",{n:miss}):""; }
$("spendBtn").onclick=()=>{ showSpend=!showSpend; updateSpend(); };

// 已入手按鈕：沒入手＝「標記已入手」；入手後＝［−］［✓ 已入手 ×N］［＋］（減到 0 就取消）
function haveHTML(id){ const n=have.get(id)||0, e=esc(id);
  if(!n) return `<button type="button" class="g-have" data-have="${e}" aria-pressed="false">${t("markHave")}</button>`;
  return `<div class="g-qty"><button type="button" class="g-step" data-qty="-1" data-id="${e}" title="${n>1?t("qtyDec"):t("unmark")}" aria-label="${n>1?t("qtyDec"):t("unmark")}">−</button>`
    +`<button type="button" class="g-have" data-have="${e}" aria-pressed="true" title="${t("unmark")}" aria-label="${t("isHave").replace("✓","").trim()} ×${n}">✓<span class="g-lbl"> ${t("isHave").replace("✓","").trim()}</span>${n>1?` <span class="g-n">×${n}</span>`:` <span class="g-n g-n1">×1</span>`}</button>`
    +`<button type="button" class="g-step" data-qty="1" data-id="${e}" title="${t("qtyInc")}" aria-label="${t("qtyInc")}">+</button></div>`; }

function cardHTML(it,g){ const on=have.has(it.id), link=it.shop||g.shop||it.post||g.post;
  const img=it.image?`<img src="${esc(it.image)}" alt="${esc(it.name)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'g-ph',innerHTML:bagSvg+t('noImage')}))">`
                    :`<span class="g-ph">${bagSvg}${t("noImage")}</span>`;
  const own={shop:it.shop&&it.shop!==g.shop?it.shop:"",post:it.post&&it.post!==g.post?it.post:""}; // 跟企劃一樣的連結就不重複顯示
  return `<article class="g-card${on?" have":""}" data-id="${esc(it.id)}">
    ${link?`<a class="g-img" href="${esc(link)}" target="_blank" rel="noopener" tabindex="-1">`:`<span class="g-img">`}${img}<span class="g-badge" aria-hidden="true">✓</span>${link?"</a>":"</span>"}
    <div class="g-body">
      ${it.oversea&&!g.oversea?`<span class="g-type g-ovs">${t("oversea")}</span>`:""}
      <h3>${esc(it.name)}</h3>
      ${it.note?`<p class="g-note">${esc(it.note)}</p>`:""}
      ${linksHTML(own)}
      ${haveHTML(it.id)}
    </div></article>`; }

const fillStatus=(a,h)=>{ const el=$("gStatus"); el.innerHTML=[["all","fAll",a],["have","fHave",h],["not","fNot",a-h]].map(([k,l,c])=>`<option value="${k}">${t(l)} (${c})</option>`).join(""); el.value=filter; };
const tpName=ty=>{ const k="tp_"+ty.replace(/ /g,"_"), v=t(k); return v&&v!==k?v:ty; };
function render(){
  const all=series.flatMap(g=>g.items), n=all.filter(i=>have.has(i.id)).length;
  $("haveN").textContent=n; $("totalN").textContent=all.length;
  $("gOrder").value=order;
  // 企劃分類：試算表企劃那一列的 goods type 填 anniversary／birthday；沒填但標了 oversea 的算海外合作；其餘算其他
  const cats=["anniversary","birthday","oversea","other"], ccount=new Map(cats.map(k=>[k,0]));
  for(const g of series) ccount.set(g.cat,ccount.get(g.cat)+g.items.length);
  $("catChips").innerHTML=[["all",t("tpAll"),all.length],...cats.map(k=>[k,t("cat_"+k),ccount.get(k)])].map(([k,l,c])=>`<button type="button" class="chip" data-cat="${k}" aria-pressed="${cfilter===k}">${esc(l)} <span class="n">${c}</span></button>`).join("");
  // 種類篩選（goods type 欄）：常見的四種固定列出，其餘照出現順序
  const tcount=new Map(); for(const i of all) if(i.type) tcount.set(i.type,(tcount.get(i.type)||0)+1);
  const known=["badge","acrylic stand","keychain","plushie"], types=[...known,...[...tcount.keys()].filter(k=>!known.includes(k))];
  $("typeChips").innerHTML=[["all",t("tpAll"),all.length],...types.map(k=>[k,tpName(k),tcount.get(k)||0])].map(([k,l,c])=>`<button type="button" class="chip" data-type="${esc(k)}" aria-pressed="${tfilter===k}">${esc(l)} <span class="n">${c}</span></button>`).join("");
  const years=[...new Set(series.map(g=>(g.date||"").slice(0,4)).filter(Boolean))].sort().reverse(); if(yfilter!=="all"&&!years.includes(yfilter)) yfilter="all";
  $("gYear").innerHTML=`<option value="all">${t("tpAll")}</option>`+years.map(y=>`<option value="${y}">${y}</option>`).join(""); $("gYear").value=yfilter;
  fillStatus(all.length,n);
  const q=query.trim().toLowerCase(), hay=(i,g)=>[i.name,i.note,i.type,i.type&&tpName(i.type),g.name,g.key,g.note].join("\n").toLowerCase();
  const keep=(i,g)=>(filter==="all"||(filter==="have")===have.has(i.id))&&(tfilter==="all"||i.type===tfilter)&&(!q||hay(i,g).includes(q));
  const pass=g=>(cfilter==="all"||g.cat===cfilter)&&(yfilter==="all"||(g.date||"").startsWith(yfilter));
  const list=[...series].sort((a,b)=>(a.date||"").localeCompare(b.date||"")*(order==="asc"?1:-1));
  const vis=list.filter(g=>pass(g)&&g.items.some(i=>keep(i,g))), rest=vis.length-limit;
  const html=vis.slice(0,limit).map(g=>{ const items=g.items.filter(i=>keep(i,g));
    const gn=g.items.filter(i=>have.has(i.id)).length, pct=Math.round(gn/g.items.length*100);
    const open=openSeries.has(g.key)||filter!=="all"||tfilter!=="all"||!!q; // 篩選已入手／未入手／類型時全部展開
    return `<section class="g-series${open?" open":""}">
      <div class="g-head">
        <button type="button" class="g-cover" data-series="${esc(g.key)}" aria-expanded="${open}" aria-label="${esc(g.name)}">${g.cover?`<img src="${esc(g.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'g-ph',innerHTML:bagSvg}))">`:`<span class="g-ph">${bagSvg}</span>`}</button>
        <div class="g-info">
          <div class="g-ttl">${g.date?`<time class="g-date" datetime="${g.date}">${fmtDate(g.date)}</time>`:""}${g.oversea?` <span class="g-type g-ovs">${t("oversea")}</span>`:""}
            <button type="button" class="g-tgl" data-series="${esc(g.key)}" aria-expanded="${open}"><h2>${esc(g.name)}</h2><svg class="g-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
            ${g.note?`<p class="g-note">${esc(g.note)}</p>`:""}</div>
          <div class="g-row">${seriesLinks(g)}
          <span class="g-prog${gn===g.items.length?" full":""}" title="${t("haveLabel")}"><i><b style="width:${pct}%"></b></i>${gn} / ${g.items.length}</span></div>
        </div>
      </div>
      ${isXPost(g.post)&&openPosts.has(g.key)?`<div class="g-post"><blockquote class="twitter-tweet" data-dnt="true" data-lang="${{zh:"zh-tw",ja:"ja",en:"en"}[lang]}" data-theme="${matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}"><a href="${esc(g.post)}">${t("openX")} ↗</a></blockquote></div>`:""}
      ${open?`<div class="g-grid">${items.map(i=>cardHTML(i,g)).join("")}</div>`:""}
    </section>`; }).join("")+(rest>0?`<button type="button" class="g-more" data-more-series>${tfm("moreSeries",{n:rest})}</button>`:"");
  updateSpend();
  $("gList").innerHTML=html||`<div class="empty"><h2>${t(!all.length?"empty":(q||tfilter!=="all"||cfilter!=="all"||yfilter!=="all")?"emptyMatch":filter==="have"?"emptyHave":"emptyNot")}</h2></div>`;
  if($("gList").querySelector(".g-post")) loadPosts().then(()=>window.twttr?.widgets?.load($("gList")));
}
function seriesLinks(g){ const x=isXPost(g.post), open=openPosts.has(g.key);
  return (g.shop||g.post)?`<div class="g-links">${g.shop?`<a class="btn" href="${esc(g.shop)}" target="_blank" rel="noopener">${t("shop")} ↗</a>`:""}${x?`<button type="button" data-post="${esc(g.key)}" aria-expanded="${open}">${open?t("hidePost"):t("showPost")}</button>`:""}${g.post?`<a class="btn" href="${esc(g.post)}" target="_blank" rel="noopener">${x?"X":t("post")} ↗</a>`:""}</div>`:""; }
// X 官方嵌入：第一次展開推文時才載入 widgets.js
let postsP=null;
function loadPosts(){ if(postsP) return postsP;
  return postsP=new Promise(res=>{ if(window.twttr?.widgets) return res();
    const s=document.createElement("script"); s.src="https://platform.twitter.com/widgets.js"; s.async=true; s.charset="utf-8";
    s.onload=()=>window.twttr?.ready?twttr.ready(()=>res()):res(); s.onerror=()=>res(); document.head.appendChild(s); }); }

document.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.cat!=null){ cfilter=b.dataset.cat; limit=PAGE; return render(); }
  if(b.dataset.type!=null){ tfilter=b.dataset.type; limit=PAGE; return render(); }
  if(b.hasAttribute("data-more-series")){ limit+=PAGE; return render(); }
  if(b.dataset.series!=null){ const k=b.dataset.series; openSeries.has(k)?openSeries.delete(k):openSeries.add(k); return render(); }
  if(b.dataset.post!=null){ const k=b.dataset.post; openPosts.has(k)?openPosts.delete(k):openPosts.add(k); return render(); }
  if(b.dataset.have!=null||b.dataset.qty){ const id=b.dataset.have??b.dataset.id, was=have.get(id)||0;
    const n=b.dataset.qty?Math.min(999,Math.max(0,was+ +b.dataset.qty)):(was?0:1); // 主按鈕：切換；−／＋：調整數量
    n?have.set(id,n):have.delete(id); saveHave();
    if(filter!=="all"&&!!n!==!!was) return render();
    // 只更新這張卡和數字，不整頁重畫
    const card=b.closest(".g-card"), on=n>0; card.classList.toggle("have",on);
    const box=card.querySelector(".g-qty")||card.querySelector(".g-have"); box.outerHTML=haveHTML(id);
    card.querySelector(n?(b.dataset.qty>0?'[data-qty="1"]':b.dataset.qty?'[data-qty="-1"]':".g-have"):".g-have")?.focus(); // 鍵盤操作時焦點留在原處
    const g=series.find(s=>s.items.some(i=>i.id===id)), gn=g.items.filter(i=>have.has(i.id)).length, p=card.closest(".g-series").querySelector(".g-prog");
    p.classList.toggle("full",gn===g.items.length); p.querySelector("b").style.width=Math.round(gn/g.items.length*100)+"%"; p.lastChild.textContent=`${gn} / ${g.items.length}`;
    $("haveN").textContent=series.flatMap(s=>s.items).filter(i=>have.has(i.id)).length; updateSpend();
    fillStatus(+$("totalN").textContent,+$("haveN").textContent); }
});
// ---- 已入手的備份：匯出成 .json 檔、再匯入（合併，不會取消原本的勾選） ----
const tfm=(k,o)=>t(k).replace(/\{(\w)\}/g,(_,x)=>o[x]??"");
function bkMsg(text,cls){ const m=$("bkMsg"); m.textContent=text; m.className="g-bk-msg "+cls; m.hidden=false; }
$("bkExport").onclick=()=>{
  if(!have.size) return bkMsg(t("bkEmpty"),"");
  const d=new Date(), p2=n=>String(n).padStart(2,"0"), day=`${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}`;
  const data={site:"mela-goods",version:2,exported:d.toISOString(),have:Object.fromEntries(have)}; // version 2：have 是 {id: 數量}
  const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:"application/json"}));
  const a=Object.assign(document.createElement("a"),{href:url,download:`mela-goods-backup-${day}.json`});
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
  bkMsg(tfm("bkExported",{n:have.size}),"ok");
};
$("bkImport").onclick=()=>{ $("bkFile").value=""; $("bkFile").click(); };
$("bkFile").onchange=async e=>{ const f=e.target.files[0]; if(!f) return;
  try{ const d=JSON.parse(await f.text());
    // 接受：version 1（have 是 id 陣列）、version 2（have 是 {id: 數量}）、單純的陣列
    const src=Array.isArray(d)?d:(d&&d.site==="mela-goods")?d.have:null;
    if(Array.isArray(src)&&!src.every(x=>typeof x==="string")) throw new Error("bad");
    const inc=toHave(src); if(!inc) throw new Error("bad");
    let m=0; for(const [id,k] of inc) if(k>(have.get(id)||0)){ have.set(id,k); m++; } // 合併：數量取較多的
    saveHave(); render(); bkMsg(tfm("bkImported",{n:inc.size,m}),"ok");
  }catch(err){ bkMsg(t("bkBad"),"err"); } };
$("gStatus").onchange=e=>{ filter=e.target.value; limit=PAGE; render(); };
$("gYear").onchange=e=>{ yfilter=e.target.value; limit=PAGE; render(); };
$("gQ").oninput=e=>{ query=e.target.value; limit=PAGE; render(); };
$("gOrder").onchange=e=>{ order=e.target.value; limit=PAGE; try{localStorage.setItem("mela-goods-order",order)}catch(_){} render(); };
window.onLangChange=()=>{ $("bkMsg").hidden=true; MelaShare.hideMsg(); render(); }; // 換語言時收起備份訊息（訊息是用舊語言寫的）
MelaShare.init({kind:"goods",panel:$("recRow"),ids:()=>series.flatMap(g=>g.items.map(i=>i.id)),
  merge:hits=>{ let n=0; for(const [id,k] of hits) if(k>(have.get(id)||0)){ have.set(id,Math.min(999,k)); n++; } if(n){ saveHave(); render(); } return n; }});

function readGoodsCache(){ try{ const c=JSON.parse(localStorage.getItem(GOODS_KEY)||"null"); return c&&typeof c.text==="string"&&c.at?c:null; }catch(e){ return null; } }
async function fetchGoods(){ const r=await fetch(GOODS_CSV_URL+(GOODS_CSV_URL.includes("?")?"&":"?")+"_="+Date.now()); if(!r.ok) throw new Error("HTTP "+r.status);
  const text=await r.text(); try{ localStorage.setItem(GOODS_KEY,JSON.stringify({text,at:Date.now()})); }catch(e){} return text; }
(async()=>{
  const cached=readGoodsCache();
  const text=cached?cached.text:await fetchGoods().catch(e=>{ console.warn("goods sheet failed",e); return ""; });
  build(text); setLang(pickLang()); MelaShare.ready();
  // 快取過期：背景更新，有變才重畫
  if(cached&&Date.now()-cached.at>=GOODS_TTL) fetchGoods().then(t2=>{ if(t2!==cached.text){ build(t2); render(); } }).catch(e=>console.warn("goods sheet refresh failed",e));
})();
</script>
</body>
</html>
