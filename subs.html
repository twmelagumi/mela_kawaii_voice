<style>
/* ===== 字幕播放頁（隱藏分頁；樣式先放在這頁裡） ===== */
.s-load{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.s-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.s-row .search{flex:1 1 320px}
.s-row .search input{padding-left:16px}
.s-drop{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 14px;border:2px dashed var(--line);border-radius:12px;color:var(--muted);font-size:13px;cursor:pointer;transition:border-color .15s,background .15s}
.s-drop:hover,.s-drop.over,body.dragging .s-drop{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.s-drop b{color:var(--ink);font-weight:700;overflow-wrap:anywhere}
.s-drop .sp{flex:1}
.s-msg{margin:0;font-size:13px;color:var(--muted)}
.s-msg.err{color:#d93d42}
.s-notice{margin:0;font-size:12px;color:var(--muted);line-height:1.6}
.s-stage{display:flex;flex-direction:column;gap:12px;width:100%;max-width:880px;margin:0 auto}
.s-stage .frame{max-height:none}
/* 桌機：影片寬度跟著視窗高度縮，讓播放器和台詞清單盡量同時看得到 */
@media (min-width:700px){.s-stage{max-width:max(520px,min(880px,calc((100svh - 430px) * 16 / 9)))}}
.s-ph{position:absolute;inset:0;display:grid;place-items:center;padding:16px;text-align:center;color:#c9d6e4;font-size:14px;background:radial-gradient(circle at 30% 25%,#1d3550,#0c121a 70%)}
/* 播放器下方：目前這句台詞（高度固定，換句時不會上下跳） */
.s-now{display:grid;place-items:center;min-height:calc(2 * 1.5em + 20px);padding:10px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:inset 3px 0 0 var(--accent);text-align:center;font-family:var(--f-display);font-weight:700;font-size:clamp(16px,2.2vw,21px);line-height:1.5}
.s-now span{white-space:pre-line;overflow-wrap:anywhere}
.s-now span+span{margin-top:2px}
.s-now.idle{box-shadow:none}
/* 讀音（SRT 裡的 <ruby>漢字<rt>かんじ</rt></ruby>） */
rt{font-size:.55em;font-weight:500;color:var(--muted);letter-spacing:0}
rp{display:none}
.s-now rt{color:var(--accent-text)}
body.has-ruby .s-now{line-height:2.1;min-height:calc(2 * 2.1em + 20px)}
body.has-ruby .s-line span{line-height:2.2}
body.has-ruby .s-line time{align-self:center}
/* 「讀音」關掉：先藏起來（位置保留，版面不跳），滑鼠移到漢字上才顯示 */
body.no-ruby rt{visibility:hidden}
body.no-ruby ruby:hover rt{visibility:visible}
.s-err{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px;color:#d93d42}
.s-tools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.s-tools .sp{flex:1}
.s-off{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.s-off button{padding:4px 10px;font-size:12px;font-family:var(--f-code)}
.s-off output{min-width:4.2em;text-align:center;font-family:var(--f-code);font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.s-find{flex:1 1 200px;min-width:0;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px}
.s-wrap{position:relative}
.s-list{position:relative;height:clamp(260px,42vh,520px);overflow-y:auto;overscroll-behavior:contain;margin:0;padding:6px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.s-list li{margin:0}
.s-line{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:baseline;width:100%;padding:7px 10px;border-radius:10px;cursor:pointer;color:var(--ink);transition:background .15s}
.s-line:hover{background:var(--bg)}
.s-line:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.s-line time{font-family:var(--f-code);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.s-line span{white-space:pre-line;overflow-wrap:anywhere;line-height:1.55}
.s-line.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.s-line.on time{color:var(--accent-text);font-weight:600}
.s-line.on span{font-weight:700;color:var(--ink)}
.s-empty{display:grid;place-items:center;height:100%;padding:16px;text-align:center;color:var(--muted);font-size:14px}
.s-follow{position:absolute;right:14px;bottom:12px;z-index:1;font-size:12px;padding:6px 14px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
@media (max-width:600px){.s-list{height:clamp(220px,46vh,460px)}.s-line{gap:8px;padding:7px 8px}}

<script>
/* ===== 字幕播放頁（隱藏分頁） =====

 * 播到哪句就加亮那句、清單自動捲過去；點任何一句就跳到那個時間。
 * - 字幕檔只在瀏覽器裡讀（FileReader），不會上傳到任何地方。
 * - 上次的網址、字幕、時間調整存在這個瀏覽器的 localStorage（mela-subs-last），下次開頁自動還原；「清除」會刪掉。
 * - 「字幕時間調整」：整份字幕往後（＋）或往前（−）挪幾秒，用在字幕和影片對不準時。
 * - 字幕檔編碼：UTF-8（含 BOM）、UTF-16；都不是就當成 Shift_JIS 讀。
 * - 雙語字幕（一句兩行）照原本換行顯示。
 * - 支援讀音：<ruby>漢字<rt>かんじ</rt></ruby>（也可加 <rp>）。其他 HTML 標籤會被拿掉。有讀音時出現「讀音」開關，搜尋也搜得到讀音。
 * - 用 file:// 直接開這頁時 YouTube 會擋（錯誤 153），要用 localhost 或正式網站開。
 */
addStrings({
 zh:{titleSubs:"めらめら日文學習",tabSubs:"字幕",subSubs:"邊看邊學習日文",linesLabel:"台詞",
   urlPh:"貼上 YouTube 影片網址",loadVideo:"載入影片",dropHint:"把 .srt／.vtt 字幕檔拖到這裡",pickFile:"選擇檔案",
   localNotice:"字幕檔只在你的瀏覽器裡讀取，不會上傳。上次的影片和字幕會留在這個瀏覽器，下次開啟自動還原。",clearAll:"清除",
   noVideo:"貼上 YouTube 網址後按「載入影片」",findPh:"搜尋台詞",offsetLabel:"字幕時間調整",reset:"歸零",rubyLabel:"讀音",rubyHelp:"顯示／隱藏漢字上的讀音（隱藏時滑鼠移到漢字上會出現）",follow:"↓ 回到目前位置",
   offsetHelp:"字幕比聲音早出現 → 按 ＋（往後挪）；字幕比聲音晚 → 按 −。點任何一句台詞就會跳到那個時間。",
   noSubs:"還沒有字幕。把 .srt／.vtt 檔拖進來就會列出全部台詞。",noMatch:"找不到符合的台詞",
   badUrl:"看不懂這個網址，請貼 YouTube 影片網址（watch?v=…、youtu.be/…、/live/…）。",badSubs:"這個檔案裡找不到字幕時間（00:00:01,000 --> 00:00:03,000 這種格式）。",
   loaded:"已讀取 {n} 句台詞。",fileErr:"讀取檔案失敗。",ytErr:"影片無法在這裡播放（錯誤 {c}）。",fileProto:"用檔案直接開啟時 YouTube 播不了（錯誤 153），請用 localhost 或正式網站開這頁。",cleared:"已清除。"},
 ja:{titleSubs:"めらめら日本語学習",tabSubs:"字幕",subSubs:"見ながら日本語を学ぼう",linesLabel:"セリフ",
   urlPh:"YouTube 動画の URL を貼り付け",loadVideo:"動画を読み込む",dropHint:".srt／.vtt 字幕ファイルをここにドロップ",pickFile:"ファイルを選択",
   localNotice:"字幕ファイルはブラウザ内だけで読み込み、アップロードはしません。前回の動画と字幕はこのブラウザに残り、次回自動で復元されます。",clearAll:"消去",
   noVideo:"YouTube の URL を貼って「動画を読み込む」",findPh:"セリフを検索",offsetLabel:"字幕のタイミング調整",reset:"リセット",rubyLabel:"ふりがな",rubyHelp:"漢字のふりがなを表示／非表示（非表示のときは漢字にマウスを乗せると出ます）",follow:"↓ 現在の位置に戻る",

 en:{titleSubs:"Mela Mela Japanese Study",tabSubs:"Subs",subSubs:"Learn Japanese as you watch",linesLabel:"Lines",
   urlPh:"Paste a YouTube video URL",loadVideo:"Load video",dropHint:"Drop an .srt / .vtt subtitle file here",pickFile:"Choose file",
   localNotice:"Subtitle files are read in your browser only — nothing is uploaded. Your last video and subtitles stay in this browser and come back next time.",clearAll:"Clear",
   noVideo:"Paste a YouTube URL and press “Load video”",findPh:"Search lines",offsetLabel:"Subtitle timing",reset:"Reset",rubyLabel:"Furigana",rubyHelp:"Show / hide readings above kanji (when hidden, hover a kanji to see it)",follow:"↓ Back to current line",

   loaded:"Loaded {n} lines.",fileErr:"Couldn't read the file.",ytErr:"This video can't be played here (error {c}).",fileProto:"YouTube won't play when this page is opened as a local file (error 153). Open it via localhost or the live site.",cleared:"Cleared."}
});
const SAVE_KEY="mela-subs-last";
let sp=null, spVid=null, cues=[], rows=[], offset=0, follow=true, onSet=new Set(), subText="", subName="", videoUrl="", msgState=null;

/* ---------- 字幕檔解析（SRT／WebVTT） ---------- */
function tc(v){ const [hms,frac=""]=v.replace(",",".").split("."); const s=hms.split(":").reduce((a,x)=>a*60+(+x),0); return s+(frac?+("0."+frac):0); }
function parseSubs(text){
  text=String(text).replace(/^﻿/,"").replace(/\r\n?/g,"\n");
  const re=/((?:\d+:)?\d{1,2}:\d{2}(?:[.,]\d{1,3})?)\s*-->\s*((?:\d+:)?\d{1,2}:\d{2}(?:[.,]\d{1,3})?)/, out=[];
  for(const b of text.split(/\n[ \t]*\n/)){
    const lines=b.split("\n"), i=lines.findIndex(l=>re.test(l)); if(i<0) continue;
    const m=lines[i].match(re);
    const raw=lines.slice(i+1).join("\n").replace(/\{\\[^}]*\}/g,"").trim();
    const txt=plain(raw.replace(/<rt>[\s\S]*?<\/rt>|<rp>[\s\S]*?<\/rp>/gi,""));
    if(!txt) continue;
    const s=tc(m[1]); let e=tc(m[2]); if(!(e>s)) e=s+2;
    const ruby=/<ruby>/i.test(raw);
    // key：搜尋用（漢字原文＋讀音都搜得到）
    out.push({s,e,text:txt,html:ruby?rubyHTML(raw):esc(txt),ruby,key:(txt+"\n"+plain(raw)).toLowerCase()});
  }
  return out.sort((a,b)=>a.s-b.s).map((c,i)=>(c.i=i,c));
}
const unent=x=>x.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&nbsp;/g," ").replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,"&");
const plain=x=>unent(String(x).replace(/<[^>]*>/g,"")).trim();
// 只留下 ruby／rt／rp 標籤，其他標籤拿掉、文字全部跳脫（避免字幕檔裡夾帶 HTML）
function rubyHTML(raw){ return raw.split(/(<[^>]*>)/).map(p=>{
  if(p.startsWith("<")){ const m=p.match(/^<(\/?)(ruby|rt|rp)\s*>$/i); return m?`<${m[1]}${m[2].toLowerCase()}>`:""; }
  return esc(unent(p)); }).join("").trim(); }
function decode(buf){ const u=new Uint8Array(buf);
  if(u[0]===0xFF&&u[1]===0xFE) return new TextDecoder("utf-16le").decode(buf);
  if(u[0]===0xFE&&u[1]===0xFF) return new TextDecoder("utf-16be").decode(buf);
  try{ return new TextDecoder("utf-8",{fatal:true}).decode(buf); }catch(e){ return new TextDecoder("shift_jis").decode(buf); } }

/* ---------- 訊息 ---------- */
function showMsg(key,vars,err){ msgState=key?{key,vars,err}:null; renderMsg(); }
function renderMsg(){ const el=$("msg"); if(!msgState){ el.hidden=true; return; }
  let s=t(msgState.key); for(const k in msgState.vars||{}) s=s.replace(`{${k}}`,msgState.vars[k]);
  el.textContent=s; el.classList.toggle("err",!!msgState.err); el.hidden=false; }

/* ---------- 存在這個瀏覽器（下次自動還原） ---------- */
function save(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify({url:videoUrl,name:subName,text:subText.length<3e6?subText:"",offset})); }catch(e){} }
function restore(){ let d=null; try{ d=JSON.parse(localStorage.getItem(SAVE_KEY)||"null"); }catch(e){}
  if(!d) return; offset=+d.offset||0;
  if(d.text) setSubs(d.text,d.name||"",true);
  if(d.url){ $("urlIn").value=d.url; loadVideo(d.url,true); } }

/* ---------- 台詞清單 ---------- */
function setSubs(text,name,quiet){
  const c=parseSubs(text);
  if(!c.length){ showMsg("badSubs",null,true); return false; }
  cues=c; subText=text; subName=name||""; onSet=new Set();
  $("fileName").textContent=subName; $("fileName").hidden=!subName;
  buildList(); applyFind(); renderNow(); updateRuby(); tick(true); save();
  if(!quiet) showMsg("loaded",{n:cues.length});
  return true;
}
function buildList(){
  const ol=$("list"); $("lineN").textContent=cues.length;
  if(!cues.length){ ol.innerHTML=`<li class="s-empty">${esc(t("noSubs"))}</li>`; rows=[]; return; }
  ol.innerHTML=cues.map(c=>`<li><button type="button" class="s-line" data-i="${c.i}"><time>${fmt(c.s+offset)}</time><span>${c.html}</span></button></li>`).join("")+`<li class="s-empty" id="noMatch" hidden>${esc(t("noMatch"))}</li>`;
  rows=[...ol.querySelectorAll(".s-line")];
  onSet.forEach(i=>rows[i]?.classList.add("on"));
}
/* 讀音開關（字幕裡有 <ruby> 才出現；開關存在這個瀏覽器） */
const RUBY_KEY="mela-subs-ruby";
let showRuby=true; try{ showRuby=localStorage.getItem(RUBY_KEY)!=="0"; }catch(e){}
function updateRuby(){ const has=cues.some(c=>c.ruby), b=$("rubyBtn");
  document.body.classList.toggle("has-ruby",has); document.body.classList.toggle("no-ruby",has&&!showRuby);
  b.hidden=!has; b.setAttribute("aria-pressed",showRuby); b.title=t("rubyHelp"); }
function renderNow(){ const el=$("nowLine"); el.hidden=!cues.length;
  el.innerHTML=[...onSet].map(i=>`<span>${cues[i].html}</span>`).join("")||"<span>&nbsp;</span>";
  el.classList.toggle("idle",!onSet.size); }
function relabel(){ rows.forEach((r,i)=>r.firstChild.textContent=fmt(cues[i].s+offset)); }
function applyFind(){ const q=$("findIn").value.trim().toLowerCase(); let n=0;
  rows.forEach((r,i)=>{ const hit=!q||cues[i].key.includes(q); r.parentNode.hidden=!hit; if(hit) n++; });
  const nm=$("noMatch"); if(nm) nm.hidden=n>0||!rows.length; }

/* ---------- 播放器 ---------- */
function loadVideo(u,quiet){
  const p=parseClipUrl(u);
  if(!p||p.src!=="youtube"){ if(!quiet) showMsg("badUrl",null,true); return; }
  videoUrl=p.url+(p.t?`&t=${p.t}s`:""); save(); $("ytErr").hidden=true;
  if(location.protocol==="file:") showMsg("fileProto",null,true); else if(!quiet) showMsg(null);
  const start=p.t||0;
  if(sp&&sp.cueVideoById){ sp.cueVideoById({videoId:p.vid,startSeconds:start}); spVid=p.vid; return; }
  $("stage").innerHTML='<div id="yt"></div>';
  spVid=p.vid;
  loadYT().then(()=>{
    sp=new YT.Player("yt",{videoId:p.vid,playerVars:{playsinline:1,rel:0,start,origin:location.origin},
      events:{onReady:()=>tick(true),
        onStateChange:()=>tick(),
        onError:e=>{ $("ytErrText").textContent=t("ytErr").replace("{c}",e.data); $("ytErrOpen").href=videoUrl; $("ytErr").hidden=false; }}});
  });
}
function now(){ try{ return sp&&sp.getCurrentTime?sp.getCurrentTime()||0:null; }catch(e){ return null; } }

/* 找出目前時間的台詞（可能同時有好幾句） */
function activeAt(x){ let lo=0,hi=cues.length-1,k=-1;
  while(lo<=hi){ const m=(lo+hi)>>1; if(cues[m].s<=x){ k=m; lo=m+1; } else hi=m-1; }
  const on=[]; for(let j=k;j>=0&&j>k-30;j--) if(cues[j].e>x) on.push(j);
  return {on:on.reverse(),last:k}; }
let lastScrollTo=-2;
function tick(force){
  if(!cues.length) return; const x=now(); if(x==null) return;
  const {on,last}=activeAt(x-offset);
  const key=on.join(",");
  if(force||key!==[...onSet].join(",")){
    onSet.forEach(i=>rows[i]?.classList.remove("on")); onSet=new Set(on); onSet.forEach(i=>rows[i]?.classList.add("on"));
    renderNow();
  }
  const target=on.length?on[0]:last;
  if(follow&&(force||target!==lastScrollTo)){ lastScrollTo=target; scrollToRow(target,!force); }
}
function scrollToRow(i,smooth){ const ol=$("list"), r=rows[Math.max(0,i)]; if(!r||r.parentNode.hidden) return;
  const li=r.parentNode, top=li.offsetTop-ol.clientHeight/2+li.offsetHeight/2;
  ignoreScroll=Date.now()+(smooth?700:150);
  ol.scrollTo({top:Math.max(0,top),behavior:smooth?"smooth":"auto"}); }
let ignoreScroll=0;
function setFollow(on){ follow=on; $("followBtn").hidden=on||!cues.length; if(on){ lastScrollTo=-2; tick(true); } }

/* ---------- 事件 ---------- */
$("urlForm").addEventListener("submit",e=>{ e.preventDefault(); loadVideo($("urlIn").value); });
function readFile(f){ if(!f) return; const r=new FileReader();
  r.onload=()=>setSubs(decode(r.result),f.name); r.onerror=()=>showMsg("fileErr",null,true); r.readAsArrayBuffer(f); }
$("fileIn").addEventListener("change",e=>{ readFile(e.target.files[0]); e.target.value=""; });
// 整個頁面都可以拖檔案進來
let dragDepth=0;
const hasFiles=e=>[...(e.dataTransfer?.types||[])].includes("Files");
document.addEventListener("dragenter",e=>{ if(!hasFiles(e)) return; e.preventDefault(); dragDepth++; document.body.classList.add("dragging"); });
document.addEventListener("dragleave",e=>{ if(!hasFiles(e)) return; if(--dragDepth<=0){ dragDepth=0; document.body.classList.remove("dragging"); } });
document.addEventListener("dragover",e=>{ if(hasFiles(e)) e.preventDefault(); });
document.addEventListener("drop",e=>{ if(!hasFiles(e)) return; e.preventDefault(); dragDepth=0; document.body.classList.remove("dragging"); readFile(e.dataTransfer.files[0]); });

$("list").addEventListener("click",e=>{ const b=e.target.closest(".s-line"); if(!b) return;
  const c=cues[+b.dataset.i]; setFollow(true);
  if(sp&&sp.seekTo){ sp.seekTo(Math.max(0,c.s+offset),true); sp.playVideo(); setTimeout(()=>tick(true),120); } });
// 使用者自己捲清單 → 暫停自動捲動，出現「回到目前位置」
["wheel","touchmove"].forEach(ev=>$("list").addEventListener(ev,()=>{ if(follow&&cues.length) setFollow(false); },{passive:true}));
$("list").addEventListener("scroll",()=>{ if(Date.now()>ignoreScroll&&follow&&cues.length) setFollow(false); },{passive:true});
$("followBtn").onclick=()=>setFollow(true);
$("rubyBtn").onclick=()=>{ showRuby=!showRuby; try{ localStorage.setItem(RUBY_KEY,showRuby?"1":"0"); }catch(e){} updateRuby(); };
$("findIn").addEventListener("input",()=>{ applyFind(); if(follow) tick(true); });
document.querySelectorAll("[data-off]").forEach(b=>b.onclick=()=>{ const d=+b.dataset.off;
  offset=d?Math.round((offset+d)*10)/10:0; $("offV").textContent=(offset>0?"+":"")+offset.toFixed(1); relabel(); tick(true); save(); });
$("clearBtn").onclick=()=>{ try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  sp?.destroy?.(); sp=null; spVid=null; cues=[]; subText=""; subName=""; videoUrl=""; offset=0; onSet=new Set();
  $("offV").textContent="0.0"; renderNow(); updateRuby(); $("urlIn").value=""; $("findIn").value=""; $("fileName").hidden=true; $("ytErr").hidden=true;
  $("stage").innerHTML=`<div class="s-ph" data-i18n="noVideo">${esc(t("noVideo"))}</div>`; buildList(); setFollow(true); showMsg("cleared"); };
setInterval(()=>tick(),150);

window.onLangChange=()=>{ $("rubyBtn").title=t("rubyHelp"); if(!cues.length) buildList(); else { const nm=$("noMatch"); if(nm) nm.textContent=t("noMatch"); } renderMsg(); };
(function init(){
  buildList(); restore(); $("offV").textContent=(offset>0?"+":"")+offset.toFixed(1); relabel();
  if(location.protocol==="file:"&&!msgState) showMsg("fileProto",null,true);
  setLang(pickLang());
})();
</script>
</body>
</html>
