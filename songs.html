<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>熱千めら 歌單</title>
<meta name="description" content="熱千めら 直播歌唱清單（非官方粉絲網站）">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=M+PLUS+1+Code:wght@400;600&display=swap">
<!-- 改了 assets 裡的檔案時，把 ?v= 後面的版本號改掉，訪客的瀏覽器才會抓新版 -->
<link rel="stylesheet" href="assets/style.css?v=202610012051">
</head>
<body data-title-key="titleSongs">
<div class="wrap">
  <header>
    <div>
      <h1><span class="jp">熱千めら</span> <span data-i18n="titleSongs"></span></h1>
      <p class="sub" data-i18n="subSongs"></p>
    </div>
    <div class="right">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="zh">中文</button>
        <button type="button" data-lang="ja">日本語</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <div class="hrow">
        <span class="count"><b id="count">0</b> <span data-i18n="songs"></span></span>
      </div>
    </div>
  </header>

  <nav class="views">
    <a href="./" data-i18n="tabVoices"></a>
    <a href="songs.html" aria-current="page" data-i18n="tabSongs"></a>
  </nav>

  <section class="view">
    <div class="tools">
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.41 1.4-5.4-5.39A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
        <input id="sq" type="search" data-i18n-ph="songSearch">
      </div>
      <select id="ssort">
        <option value="date" data-i18n="sortDate"></option>
        <option value="title" data-i18n="sortTitle"></option>
        <option value="artist" data-i18n="sortArtist"></option>
      </select>
      <button type="button" id="sshuffle" data-i18n="randomSong"></button>
    </div>
    <div class="tags" id="cats"></div>
    <div class="setlist" id="songList"></div>
  </section>

  <footer>
    <p data-i18n="footer"></p>
    <div class="dc">
      <span class="dc-tag" data-i18n="dcPromo"></span>
      <span class="dc-label" data-i18n="dcLabel"></span>
      <ul>
        <li><span lang="zh-Hant">中文</span> <b class="dc-name" lang="zh-Hant">火蜥蜴救火隊</b> <a href="https://discord.gg/qbEFfzASZJ" target="_blank" rel="noopener">discord.gg/qbEFfzASZJ</a></li>
        <li><span lang="ja">日本語</span> <b class="dc-name" lang="ja">めら組でいすこーど分団</b> <a href="https://discord.gg/MdXnazUU6" target="_blank" rel="noopener">discord.gg/MdXnazUU6</a></li>
        <li><span lang="en">English</span> <b class="dc-name" lang="en">Achichi's Mela-Gumi's</b> <a href="https://discord.gg/Achichimela" target="_blank" rel="noopener">discord.gg/Achichimela</a></li>
      </ul>
      <span class="dc-join" data-i18n="dcJoin"></span>
    </div>
    <p class="report" hidden><span data-i18n="reportLabel"></span> <a id="reportLink" href="#" target="_blank" rel="noopener" data-i18n="reportLink"></a></p>
    <p class="colophon"><span id="updated" hidden><span data-i18n="updatedLabel"></span> <time id="updatedAt"></time><span class="sep" aria-hidden="true">·</span></span><span data-i18n="madeWith"></span></p>
  </footer>
</div>

<div class="player" id="player" hidden>
  <div class="player-in">
    <div id="stage"></div>
    <div class="pinfo">
      <h3 id="pTitle"></h3>
      <div class="meta" id="pMeta"></div>
      <div class="pbtns">
        <button type="button" class="primary" id="pReplay" data-i18n="replay"></button>
        <a class="btn" id="pOpen" target="_blank" rel="noopener" data-i18n="openOriginal"></a>
        <button type="button" id="pClose" data-i18n="close"></button>
      </div>
    </div>
  </div>
</div>

<script src="assets/common.js?v=202610012051"></script>
<script>
/* ===== 歌單頁 =====
 * 歌曲資料放在 songs.json，格式見 README.md。
 * 每首歌：{ "title": 歌名, "artist": 原唱, "category": "cover", "url": YouTube 網址, "start": "1:02:03", "end": "1:06:10", "streamDate": "2026-09-30" }
 * category（分類）：original / cover / clip（歌回）/ other，沒填就當 other
 */
addStrings({
 zh:{titleSongs:"歌單",subSongs:"めらちゃん在直播裡唱過的歌，按一下就在這裡播放。",songs:"首歌",songSearch:"搜尋歌名、原唱…",
   sortDate:"配信日期",sortTitle:"歌名",sortArtist:"原唱歌手",randomSong:"隨機播一首",unknownDate:"日期未知",
   catAll:"全部",cat_original:"Original",cat_cover:"Cover",cat_clip:"歌回",cat_other:"Other",
   noSongs:"還沒有收錄歌曲",noSongsHint:"更新 songs.json 後就會出現在這裡。",noSongMatch:"找不到符合的歌曲",noSongMatchHint:"換個關鍵字試試。"},
 ja:{titleSongs:"歌リスト",subSongs:"めらちゃんが配信で歌った曲のまとめ。押すとこのページで再生します。",songs:"曲",songSearch:"曲名・原曲アーティストで検索…",
   sortDate:"配信日順",sortTitle:"曲名順",sortArtist:"アーティスト順",randomSong:"ランダム再生",unknownDate:"日付不明",
   catAll:"すべて",cat_original:"オリジナル",cat_cover:"カバー",cat_clip:"歌枠",cat_other:"その他",
   noSongs:"まだ曲がありません",noSongsHint:"songs.json を更新するとここに表示されます。",noSongMatch:"該当する曲がありません",noSongMatchHint:"キーワードを変えてみてください。"},
 en:{titleSongs:"Song List",subSongs:"Songs Mera has sung on stream. Press play to listen right here.",songs:"songs",songSearch:"Search title or original artist…",
   sortDate:"Stream date",sortTitle:"Title",sortArtist:"Original artist",randomSong:"Play a random song",unknownDate:"Unknown date",
   catAll:"All",cat_original:"Original",cat_cover:"Cover",cat_clip:"Karaoke",cat_other:"Other",
   noSongs:"No songs yet",noSongsHint:"Songs show up here once songs.json is updated.",noSongMatch:"No matching songs",noSongMatchHint:"Try another keyword."}
});

let SONGS=[], songsLoaded=false, activeCat=null;
// 分類（顯示順序）。songs.json 的 category 可以寫英文代碼或常見中日文寫法
const CATS=["original","cover","clip","other"];
function normCat(v){ v=String(v||"").trim().toLowerCase();
  if(/^(original|orig|オリジナル|原創|原创|オリ曲)$/.test(v)) return "original";
  if(/^(cover|カバー|翻唱|歌ってみた)$/.test(v)) return "cover";
  if(/^(clip|歌回clip|歌回|歌枠|歌枠切り抜き|切り抜き|karaoke)$/.test(v)) return "clip";
  return "other"; }

/* ===== 畫面 ===== */
function renderSongs(){
  $("count").textContent=SONGS.length;
  const box=$("songList");
  if(!songsLoaded){ box.innerHTML=""; return; }
  if(!SONGS.length){ box.innerHTML=`<div class="empty"><h2>${t("noSongs")}</h2><p>${t("noSongsHint")}</p></div>`; return; }
  const counts={}; SONGS.forEach(s=>counts[s.category]=(counts[s.category]||0)+1);
  $("cats").innerHTML=`<button type="button" class="chip" data-cat="" aria-pressed="${!activeCat}">${t("catAll")} <span class="n">${SONGS.length}</span></button>`+
    CATS.filter(c=>counts[c]).map(c=>`<button type="button" class="chip" data-cat="${c}" aria-pressed="${activeCat===c}">${t("cat_"+c)} <span class="n">${counts[c]}</span></button>`).join("");
  const q=$("sq").value.trim().toLowerCase();
  let list=SONGS.filter(s=>(!activeCat||s.category===activeCat)&&(!q||[s.title,s.artist,s.note,s.streamDate,t("cat_"+s.category)].join(" ").toLowerCase().includes(q)));
  if(!list.length){ box.innerHTML=`<div class="empty"><h2>${t("noSongMatch")}</h2><p>${t("noSongMatchHint")}</p></div>`; return; }
  const mode=$("ssort").value, coll=new Intl.Collator(lang==="zh"?"zh-Hant":lang);
  const row=(s,showDate)=>`<div class="song${current&&current.id===s.id?" playing":""}" data-id="${esc(s.id)}">
      <button type="button" class="thumb" data-splay="${esc(s.id)}" aria-label="${t("play")}: ${esc(s.title)}"><img src="https://i.ytimg.com/vi/${encodeURIComponent(s.vid)}/mqdefault.jpg" alt="" loading="lazy" decoding="async"><span class="tplay">${playSvg}</span></button>
      <div class="sinfo"><b>${esc(s.title)}</b><span><em class="cat cat-${s.category}">${t("cat_"+s.category)}</em>${esc(s.artist)}</span></div>
      <div class="sside">${showDate&&s.streamDate?`<span>${esc(s.streamDate)}</span>`:""}${s.start!=null?`<span>${fmt(s.start)}</span>`:""}</div>
    </div>`;
  if(mode==="date"){
    // 依配信日期分組（新的在上），同一場依開始時間排
    list.sort((a,b)=>String(b.streamDate||"").localeCompare(String(a.streamDate||""))||(a.start??0)-(b.start??0)||a.order-b.order);
    const groups=[]; for(const s of list){ const k=s.streamDate||""; if(!groups.length||groups[groups.length-1].k!==k) groups.push({k,items:[]}); groups[groups.length-1].items.push(s); }
    box.innerHTML=groups.map(g=>`<section class="sgroup"><h2>${g.k?esc(g.k):`<span>${t("unknownDate")}</span>`}<span>${g.items.length} ${t("songs")}</span></h2>
      <div class="slist">${g.items.map(s=>row(s,false)).join("")}</div></section>`).join("");
  }else{
    const key=mode==="title"?"title":"artist";
    list.sort((a,b)=>coll.compare(a[key]||"",b[key]||"")||String(b.streamDate||"").localeCompare(String(a.streamDate||"")));
    box.innerHTML=`<div class="slist">${list.map(s=>row(s,true)).join("")}</div>`;
  }
}
window.onLangChange=renderSongs;

/* ===== 事件 ===== */
document.addEventListener("click",e=>{ const b=e.target.closest("button[data-splay]"); if(b) play(SONGS.find(s=>s.id===b.dataset.splay));
  const c=e.target.closest("button[data-cat]"); if(c){ activeCat=c.dataset.cat||null; renderSongs(); } });
$("sq").addEventListener("input",renderSongs); $("ssort").addEventListener("change",renderSongs);
$("sshuffle").onclick=()=>{ if(SONGS.length) play(SONGS[Math.floor(Math.random()*SONGS.length)]); };

/* ===== 讀資料：songs.json ===== */
async function loadSongs(){
  let d=[]; try{ const r=await fetch("songs.json",{cache:"no-cache"}); if(r.ok) d=await r.json(); }catch(e){ console.warn("songs.json load failed（格式可能有誤）",e); }
  const arr=Array.isArray(d)?d:(d.songs||[]);
  SONGS=arr.map((x,i)=>{ if(!x||!x.title) return null; const p=parseClipUrl(x.url||""); if(!p||p.src!=="youtube") return null;
    let start=parseTime(x.start); const end=parseTime(x.end); if(start==null&&p.t!=null) start=p.t;
    return {id:"s"+hash(p.vid+"|"+(start??"")+"|"+x.title).toString(36),src:"youtube",vid:p.vid,url:p.url,start,end:(end!=null&&start!=null&&end<=start)?null:end,
      title:String(x.title),artist:x.artist?String(x.artist):"",category:normCat(x.category),streamDate:x.streamDate?normDate(x.streamDate):null,note:x.note||"",order:i}; }).filter(Boolean);
  songsLoaded=true; renderSongs();
}

setLang(pickLang());
loadSongs();
</script>
</body>
</html>
