<script>

 * category（分類）：original / cover / clip（歌回）/ other，沒填就當 other

 * singers（演唱者）：合唱曲才需要填，例如 ["熱千めら","宙科そぴあ"] 或 "熱千めら / 宙科そぴあ"；沒填就當作めら一個人唱
 */
addStrings({
 zh:{titleSongs:"めらめら歌單",subSongs:"めらちゃん在直播裡唱過的歌，按一下就在這裡播放。",songs:"首歌",songSearch:"搜尋歌名、原唱…",
   sortDate:"配信日期",sortTitle:"歌名",sortArtist:"原唱歌手",randomSong:"隨機播一首",unknownDate:"日期未知",
   viewsUnit:"次",viewsTitle:"YouTube 播放次數",statsNote:"原創曲與 Cover 的播放次數取自 YouTube（{d} 更新，每兩天更新一次）。",catAll:"全部",cat_original:"Original",cat_cover:"Cover",cat_clip:"歌回",cat_other:"Other",
   noSongs:"還沒有收錄歌曲",noSongsHint:"更新 songs.json 後就會出現在這裡。",noSongMatch:"找不到符合的歌曲",noSongMatchHint:"換個關鍵字試試。",singersLabel:"演唱",withLabel:"合唱對象",pmSrc:"根據 ",pmSrcLink:"YouTube IFrame API 官方文件",pmLabel:"播放方式",pmAuto:"自動播放",pmManual:"手動播放",pmNote:"，嵌入式播放器自動播放的影片，可能不會計入原影片的觀看次數。選擇「手動播放」後，請按影片畫面上的播放鍵開始播放；待播清單也只會先載入下一首，按下播放鍵才會開始。",periodLabel:"期間",allPeriod:"全部",wholeYear:"整年",yearFmt:"{y} 年",monthFmt:"{m} 月",expand:"展開",collapse:"收合",
   addQueue:"加入待播清單",inQueue:"已在待播清單",added:"已加入待播清單",songPick:"推薦",playAll:"▶ 全部播放",playList:"▶ 播放目前列表",queue:"待播清單",prev:"⏮ 上一首",next:"下一首 ⏭",
   shuffleQ:"打亂順序",repeat:"循環",clearQ:"清空",queueEmpty:"清單是空的。按歌曲右邊的 ＋ 加入。",resumeQ:"▶ 待播清單",moveUp:"上移",moveDown:"下移",remove:"移除"},
 ja:{titleSongs:"めらめら歌リスト",subSongs:"めらちゃんが配信で歌った曲のまとめ。押すとこのページで再生します。",songs:"曲",songSearch:"曲名・原曲アーティストで検索…",
   sortDate:"配信日順",sortTitle:"曲名順",sortArtist:"アーティスト順",randomSong:"ランダム再生",unknownDate:"日付不明",
   viewsUnit:"回",viewsTitle:"YouTube 再生回数",statsNote:"オリジナル曲・カバー曲の再生回数は YouTube から取得しています（{d} 時点、2日ごとに更新）。",catAll:"すべて",cat_original:"オリジナル",cat_cover:"カバー",cat_clip:"歌枠",cat_other:"その他",
   noSongs:"まだ曲がありません",noSongsHint:"songs.json を更新するとここに表示されます。",noSongMatch:"該当する曲がありません",noSongMatchHint:"キーワードを変えてみてください。",singersLabel:"歌唱",withLabel:"コラボ相手",pmSrc:"",pmSrcLink:"YouTube IFrame API 公式ドキュメント",pmLabel:"再生方法",pmAuto:"自動再生",pmManual:"手動再生",pmNote:"によると、埋め込みプレーヤーで自動再生された動画は、元動画の再生回数にカウントされない場合があります。「手動再生」では、動画の再生ボタンを押して再生してください。連続再生も次の曲を読み込むだけなので、再生ボタンを押すと始まります。",periodLabel:"期間",allPeriod:"すべて",wholeYear:"通年",yearFmt:"{y}年",monthFmt:"{m}月",expand:"開く",collapse:"閉じる",
   addQueue:"再生キューに追加",inQueue:"キューに追加済み",added:"再生キューに追加しました",songPick:"おすすめ",playAll:"▶ すべて再生",playList:"▶ 表示中の曲を再生",queue:"再生キュー",prev:"⏮ 前へ",next:"次へ ⏭",
   shuffleQ:"シャッフル",repeat:"リピート",clearQ:"クリア",queueEmpty:"キューは空です。曲の右の ＋ で追加できます。",resumeQ:"▶ 再生キュー",moveUp:"上へ",moveDown:"下へ",remove:"削除"},
 en:{titleSongs:"Mela Mela Song List",subSongs:"Songs Mela has sung on stream. Press play to listen right here.",songs:"songs",songSearch:"Search title or original artist…",
   sortDate:"Stream date",sortTitle:"Title",sortArtist:"Original artist",randomSong:"Play a random song",unknownDate:"Unknown date",
   viewsUnit:" views",viewsTitle:"YouTube views",statsNote:"View counts for originals and covers come from YouTube (as of {d}, updated every two days).",catAll:"All",cat_original:"Original",cat_cover:"Cover",cat_clip:"Karaoke",cat_other:"Other",
   noSongs:"No songs yet",noSongsHint:"Songs show up here once songs.json is updated.",noSongMatch:"No matching songs",noSongMatchHint:"Try another keyword.",singersLabel:"Vocals",withLabel:"Sung with",pmSrc:"According to the ",pmSrcLink:"YouTube IFrame API reference",pmLabel:"Playback",pmAuto:"Autoplay",pmManual:"Manual",pmNote:", autoplayed embedded videos may not count toward the original video\'s views. In Manual mode, press the play button on the video to start. The queue only loads the next song, so press play again to hear it.",periodLabel:"Period",allPeriod:"All",wholeYear:"Whole year",yearFmt:"{y}",monthFmt:"",expand:"Expand",collapse:"Collapse",
   addQueue:"Add to queue",inQueue:"Already in queue",added:"Added to queue",songPick:"Recommended",playAll:"▶ Play all",playList:"▶ Play this list",queue:"Queue",prev:"⏮ Prev",next:"Next ⏭",
   shuffleQ:"Shuffle",repeat:"Repeat",clearQ:"Clear",queueEmpty:"The queue is empty. Use ＋ next to a song to add it.",resumeQ:"▶ Queue",moveUp:"Move up",moveDown:"Move down",remove:"Remove"}
});

let lastPicks=[];
let STATS=null; // song_stats.json：{updated, views:{影片ID:播放次數}}，原創曲／Cover 顯示播放次數（GitHub Actions 每兩天更新）
let SONGS=[], songsLoaded=false, activeCat=null, activeSinger=null, activeYear=null, activeMonth=null;
// 依配信日期分組時，只預設展開最近幾場；有篩選或搜尋時全部展開。手動點過的分組會記住。
const RECENT_GROUPS=3;
const groupOpen={};
function monthName(m){ return lang==="en"?new Intl.DateTimeFormat("en",{month:"short"}).format(new Date(2000,m-1,1)):t("monthFmt").replace("{m}",m); }
const MAIN_SINGER="熱千めら";
function parseSingers(v){ const a=(Array.isArray(v)?v:String(v||"").split(/\s*[\/／、,，]\s*/)).map(x=>String(x).trim()).filter(Boolean); return a.length?[...new Set(a)]:[MAIN_SINGER]; }
const isDuet=s=>!(s.singers.length===1&&s.singers[0]===MAIN_SINGER);
// 分類（顯示順序）。songs.json 的 category 可以寫英文代碼或常見中日文寫法
const CATS=["original","cover","clip","other"];
function normCat(v){ v=String(v||"").trim().toLowerCase();
  if(/^(original|orig|オリジナル|原創|原创|オリ曲)$/.test(v)) return "original";
  if(/^(cover|カバー|翻唱|歌ってみた)$/.test(v)) return "cover";
  if(/^(clip|歌回clip|歌回|歌枠|歌枠切り抜き|切り抜き|karaoke)$/.test(v)) return "clip";
  return "other"; }

/* ===== 畫面 ===== */
const STAT_CATS=["original","cover"];
function viewsOf(s){ return STAT_CATS.includes(s.category)&&STATS&&STATS.views?STATS.views[s.vid]:undefined; }
function fmtViews(n){ const loc={zh:"zh-Hant",ja:"ja",en:"en"}[lang]; return new Intl.NumberFormat(loc,{notation:"compact",maximumFractionDigits:1}).format(n)+t("viewsUnit"); }
function renderStatsNote(){ const el=$("statsNote"); const ok=STATS&&STATS.updated&&SONGS.some(s=>viewsOf(s)!=null); el.hidden=!ok; if(!ok) return;
  const d=new Date(STATS.updated), p=n=>String(n).padStart(2,"0"); el.textContent=t("statsNote").replace("{d}",isNaN(d)?STATS.updated:`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`); }
function renderSongs(){
  $("count").textContent=SONGS.length; renderStatsNote();
  const box=$("songList");
  if(!songsLoaded){ box.innerHTML=""; return; }
  if(!SONGS.length){ box.innerHTML=`<div class="empty"><h2>${t("noSongs")}</h2><p>${t("noSongsHint")}</p></div>`; return; }
  const counts={}; SONGS.forEach(s=>counts[s.category]=(counts[s.category]||0)+1);
  $("cats").innerHTML=`<button type="button" class="chip" data-cat="" aria-pressed="${!activeCat}">${t("catAll")} <span class="n">${SONGS.length}</span></button>`+
    CATS.filter(c=>counts[c]).map(c=>`<button type="button" class="chip" data-cat="${c}" aria-pressed="${activeCat===c}">${t("cat_"+c)} <span class="n">${counts[c]}</span></button>`).join("");
  // 合唱對象：列出めら以外出現過的演唱者，點了只看跟這個人一起唱的歌
  const sc={}; SONGS.forEach(s=>s.singers.forEach(n=>{ if(n!==MAIN_SINGER) sc[n]=(sc[n]||0)+1; }));
  const names=Object.keys(sc).sort((a,b)=>sc[b]-sc[a]||a.localeCompare(b));
  $("singerChips").hidden=!names.length;
  $("singerChips").innerHTML=names.length?`<span class="chips-label">${t("withLabel")}</span><button type="button" class="chip" data-singer="" aria-pressed="${!activeSinger}">${t("catAll")}</button>`+
    names.map(n=>`<button type="button" class="chip" data-singer="${esc(n)}" aria-pressed="${activeSinger===n}">${esc(n)} <span class="n">${sc[n]}</span></button>`).join(""):"";
  // 期間：年份 → 月份
  const ym={}; SONGS.forEach(s=>{ const m=/^(\d{4})-(\d{2})/.exec(s.streamDate||""); if(m){ (ym[m[1]]=ym[m[1]]||{})[+m[2]]=(ym[m[1]][+m[2]]||0)+1; } });
  const years=Object.keys(ym).sort().reverse(), ycount=y=>Object.values(ym[y]).reduce((a,b)=>a+b,0);
  if(activeYear&&!ym[activeYear]){ activeYear=null; activeMonth=null; }
  $("yearChips").hidden=!years.length;
  $("yearChips").innerHTML=years.length?`<span class="chips-label">${t("periodLabel")}</span><button type="button" class="chip" data-year="" aria-pressed="${!activeYear}">${t("allPeriod")}</button>`+
    years.map(y=>`<button type="button" class="chip" data-year="${y}" aria-pressed="${activeYear===y}">${t("yearFmt").replace("{y}",y)} <span class="n">${ycount(y)}</span></button>`).join(""):"";
  const months=activeYear?Object.keys(ym[activeYear]).map(Number).sort((a,b)=>b-a):[];
  $("monthChips").hidden=!activeYear;
  $("monthChips").innerHTML=activeYear?`<span class="chips-label">${t("yearFmt").replace("{y}",activeYear)}</span><button type="button" class="chip" data-month="" aria-pressed="${!activeMonth}">${t("wholeYear")}</button>`+
    months.map(m=>`<button type="button" class="chip" data-month="${m}" aria-pressed="${activeMonth===m}">${monthName(m)} <span class="n">${ym[activeYear][m]}</span></button>`).join(""):"";
  const inPeriod=s=>{ if(!activeYear) return true; const m=/^(\d{4})-(\d{2})/.exec(s.streamDate||""); return !!m&&m[1]===activeYear&&(!activeMonth||+m[2]===activeMonth); };
  const q=$("sq").value.trim().toLowerCase();
  const filtering=!!(activeCat||activeSinger||activeYear||q);
  let list=SONGS.filter(s=>inPeriod(s)&&(!activeCat||s.category===activeCat)&&(!activeSinger||s.singers.includes(activeSinger))&&(!q||[s.title,s.artist,s.note,s.streamDate,t("cat_"+s.category),...s.singers].join(" ").toLowerCase().includes(q)));
  $("songPicks").hidden=true;
  if(!list.length){ lastVisible=[]; box.innerHTML=`<div class="empty"><h2>${t("noSongMatch")}</h2><p>${t("noSongMatchHint")}</p></div>`; return; }
  const mode=$("ssort").value, coll=new Intl.Collator(lang==="zh"?"zh-Hant":lang);
  const row=(s,showDate)=>`<div class="song${current&&current.id===s.id?" playing":""}" data-id="${esc(s.id)}">
      <button type="button" class="thumb" data-splay="${esc(s.id)}" aria-label="${t("play")}: ${esc(s.title)}"><img src="https://i.ytimg.com/vi/${encodeURIComponent(s.vid)}/mqdefault.jpg" alt="" loading="lazy" decoding="async"><span class="tplay">${playSvg}</span></button>
      <div class="sinfo"><b>${esc(s.title)}</b><span><em class="cat cat-${s.category}">${t("cat_"+s.category)}</em>${esc(s.artist)}</span>${isDuet(s)?`<span class="singers"><i>${t("singersLabel")}</i>${s.singers.map(n=>`<button type="button" data-singer="${esc(n)}">${esc(n)}</button>`).join('<span class="sl">/</span>')}</span>`:""}</div>
      <div class="sside">${viewsOf(s)!=null?`<span class="vcount" title="${t("viewsTitle")}">▶ ${fmtViews(viewsOf(s))}</span>`:""}</div>
      ${addBtn(s)}
    </div>`;
  // 推薦：songs.json 裡 "pick": true 的歌，照 songs.json 的順序。有篩選或搜尋時先收起來。
  lastPicks=SONGS.filter(s=>s.pick);
  if(lastPicks.length&&!filtering){ $("songPicks").hidden=false; $("songPickList").innerHTML=lastPicks.map(s=>row(s,true)).join(""); }
  if(mode==="date"){
    // 依配信日期分組（新的在上），同一場依開始時間排
    list.sort((a,b)=>String(b.streamDate||"").localeCompare(String(a.streamDate||""))||(a.start??0)-(b.start??0)||a.order-b.order);
    const groups=[]; lastGroups=groups; for(const s of list){ const k=s.streamDate||""; if(!groups.length||groups[groups.length-1].k!==k) groups.push({k,items:[]}); groups[groups.length-1].items.push(s); }
    box.innerHTML=groups.map((g,gi)=>{ const open=g.k in groupOpen?groupOpen[g.k]:(filtering||gi<RECENT_GROUPS);
      return `<section class="sgroup${open?"":" closed"}"><h2><button type="button" class="gtoggle" data-gtoggle="${esc(g.k)}" data-open="${open}" aria-expanded="${open}" title="${t(open?"collapse":"expand")}"><span class="garrow" aria-hidden="true">${open?"▾":"▸"}</span>${g.k?esc(g.k):t("unknownDate")}</button><span>${g.items.length} ${t("songs")}</span><button type="button" class="gplay" data-gplay="${gi}">${t("playAll")}</button></h2>
      ${open?`<div class="slist">${g.items.map(s=>row(s,false)).join("")}</div>`:""}</section>`; }).join("");
  }else{
    const key=mode==="title"?"title":"artist";
    list.sort((a,b)=>coll.compare(a[key]||"",b[key]||"")||String(b.streamDate||"").localeCompare(String(a.streamDate||"")));
    box.innerHTML=`<div class="slist">${list.map(s=>row(s,true)).join("")}</div>`;
  }
  lastVisible=mode==="date"?lastGroups.flatMap(g=>g.items):list;
}
window.onLangChange=()=>{ renderSongs(); renderQueue(); };

/* ===== 待播清單 =====
 * Q.ids：歌曲 id 的順序；Q.idx：目前播到第幾首；Q.repeat：播完整個清單後從頭再來。
 * 存在訪客瀏覽器（localStorage），重新整理後還在。
 */
const QKEY="mela-queue";
let Q={ids:[],idx:-1,repeat:false}, qOpen=!matchMedia("(max-width:700px)").matches, lastGroups=[], lastVisible=[];
const byId=id=>SONGS.find(s=>s.id===id);
function saveQueue(){ try{ localStorage.setItem(QKEY,JSON.stringify(Q)); }catch(e){} }
function loadQueue(){ try{ const q=JSON.parse(localStorage.getItem(QKEY)||"null"); if(q&&Array.isArray(q.ids)){
    const ids=q.ids.filter(id=>byId(id)); // 已經從 songs.json 移除的歌就略過
    Q={ids,idx:Math.min(typeof q.idx==="number"?q.idx:-1,ids.length-1),repeat:!!q.repeat}; } }catch(e){} }
function toast(msg){ const el=$("toast"); el.textContent=msg; el.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>el.hidden=true,1800); }
function addBtn(s){ const inq=Q.ids.includes(s.id); return `<button type="button" class="qadd${inq?" inq":""}" data-qadd="${esc(s.id)}" aria-label="${t(inq?"inQueue":"addQueue")}: ${esc(s.title)}" title="${t(inq?"inQueue":"addQueue")}">${inq?"✓":"＋"}</button>`; }
let lastStartAt=0;
function startAt(i){ Q.idx=i; lastStartAt=Date.now(); saveQueue(); const s=byId(Q.ids[i]); if(s) play(s); renderQueue(); refreshAddButtons(); }
// ▶ 直接播：插在目前這首後面並立刻播放（清單之後照常往下）
function playNow(s){ if(!s) return; const at=Q.ids.indexOf(s.id);
  if(at>=0) return startAt(at);
  const pos=Q.idx>=0&&!$("player").hidden?Q.idx+1:Q.ids.length; Q.ids.splice(pos,0,s.id); startAt(pos); }
// ＋ 加到清單最後；沒在播放時直接開始
function addToQueue(s){ if(!s) return;
  if(Q.ids.includes(s.id)){ toast(t("inQueue")); return; }
  Q.ids.push(s.id); saveQueue();
  if($("player").hidden) startAt(Q.ids.length-1); else { toast(t("added")); renderQueue(); refreshAddButtons(); } }
// 全部播放：用這組歌取代清單，從第一首開始
function playList(list){ if(!list.length) return; Q.ids=list.map(s=>s.id); startAt(0); }
function jumpTo(i){ if(i>=0&&i<Q.ids.length) startAt(i); }
function step(d){ if(!Q.ids.length) return; let i=Q.idx+d;
  if(i>=Q.ids.length){ if(!Q.repeat) return; i=0; } if(i<0){ if(!Q.repeat) return; i=Q.ids.length-1; } startAt(i); }
function moveItem(i,d){ const j=i+d; if(j<0||j>=Q.ids.length) return; [Q.ids[i],Q.ids[j]]=[Q.ids[j],Q.ids[i]];
  if(Q.idx===i) Q.idx=j; else if(Q.idx===j) Q.idx=i; saveQueue(); renderQueue(); }
function removeItem(i){ const wasNow=i===Q.idx; Q.ids.splice(i,1);
  // 刪掉正在播的歌時，指標退回前一格，這樣「下一首」（i）剛好就是原本排在它後面的歌
  if(i<Q.idx||wasNow) Q.idx--;
  saveQueue(); renderQueue(); refreshAddButtons(); }
function shuffleUpcoming(){ const head=Q.ids.slice(0,Q.idx+1), rest=Q.ids.slice(Q.idx+1);
  for(let i=rest.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [rest[i],rest[j]]=[rest[j],rest[i]]; }
  Q.ids=head.concat(rest); saveQueue(); renderQueue(); }
function clearQueue(){ const cur=current&&Q.ids[Q.idx]===current.id?current.id:null; Q.ids=cur?[cur]:[]; Q.idx=cur?0:-1; saveQueue(); renderQueue(); refreshAddButtons(); }
function refreshAddButtons(){ document.querySelectorAll("button[data-qadd]").forEach(b=>{ const s=byId(b.dataset.qadd); if(s) b.outerHTML=addBtn(s); }); }
function renderQueue(){
  $("qCount").textContent=Q.ids.length?`${Math.max(Q.idx+1,0)}/${Q.ids.length}`:"0";
  $("qArrow").textContent=qOpen?"▾":"▸"; $("qToggle").setAttribute("aria-expanded",qOpen);
  $("qRepeat").setAttribute("aria-pressed",Q.repeat);
  $("qList").hidden=!qOpen;
  $("qList").innerHTML=Q.ids.length?Q.ids.map((id,i)=>{ const s=byId(id); if(!s) return "";
    return `<li class="${i===Q.idx?"now":""}"><span class="qn">${i===Q.idx?"▶":i+1}</span>
      <button type="button" class="qt" data-qjump="${i}"><b>${esc(s.title)}</b><span>${esc(s.artist)}${s.streamDate?" · "+esc(s.streamDate):""}</span></button>
      <span class="qops"><button type="button" data-qup="${i}" aria-label="${t("moveUp")}" title="${t("moveUp")}">↑</button><button type="button" data-qdown="${i}" aria-label="${t("moveDown")}" title="${t("moveDown")}">↓</button><button type="button" data-qrm="${i}" aria-label="${t("remove")}" title="${t("remove")}">✕</button></span></li>`; }).join("")
    :`<li><span></span><p class="qempty">${t("queueEmpty")}</p><span></span></li>`;
  const playerOpen=!$("player").hidden;
  $("qPrev").disabled=$("mPrev").disabled=!(Q.repeat?Q.ids.length:Q.idx>0); $("qNext").disabled=$("mNext").disabled=!(Q.repeat?Q.ids.length:Q.idx<Q.ids.length-1);
  $("qFab").hidden=playerOpen||!Q.ids.length; $("qFab").textContent=`${t("resumeQ")} (${Q.ids.length})`;
}
// 一首播完（或播到 end 時間）→ 下一首；最後一首播完且沒開循環就停在那裡
// YouTube 播到 end 時間時，常會連續送出兩次「播放結束」，或在換歌後補送一次舊的。
// 只有「剛換歌超過 2 秒」而且「播放位置真的到了這首的結尾」才接下一首，避免一次跳兩首。
window.onPlayerEnded=(c,p)=>{
  if(Date.now()-lastStartAt<2000) return;
  // 用「正在播的歌」(c) 判斷是否真的播完；它可能已經從清單刪掉了，所以不要求它還在 Q.idx 上
  if(!c) return;
  try{ const now=p.getCurrentTime(), endAt=c.end!=null?c.end:p.getDuration(); if(endAt&&now<endAt-3) return; }catch(e){}
  const n=Q.idx+1;
  if(n<Q.ids.length) startAt(n); else if(Q.repeat&&Q.ids.length) startAt(0); };
window.onPlayerClosed=()=>renderQueue();

/* ===== 事件 ===== */
document.addEventListener("click",e=>{ const b=e.target.closest("button[data-splay]"); if(b) playNow(SONGS.find(s=>s.id===b.dataset.splay));
  const a=e.target.closest("button[data-qadd]"); if(a) addToQueue(SONGS.find(s=>s.id===a.dataset.qadd));
  if(e.target.closest("#pickPlay")&&lastPicks.length) playList(lastPicks);
  const g=e.target.closest("button[data-gplay]"); if(g&&lastGroups[+g.dataset.gplay]) playList(lastGroups[+g.dataset.gplay].items);
  const qj=e.target.closest("[data-qjump]"); if(qj) jumpTo(+qj.dataset.qjump);
  const qu=e.target.closest("[data-qup]"); if(qu) moveItem(+qu.dataset.qup,-1);
  const qd=e.target.closest("[data-qdown]"); if(qd) moveItem(+qd.dataset.qdown,1);
  const qr=e.target.closest("[data-qrm]"); if(qr) removeItem(+qr.dataset.qrm);
  const c=e.target.closest("button[data-cat]"); if(c){ activeCat=c.dataset.cat||null; renderSongs(); }
  const yb=e.target.closest("button[data-year]"); if(yb){ activeYear=yb.dataset.year||null; activeMonth=null; renderSongs(); }
  const mb=e.target.closest("button[data-month]"); if(mb){ activeMonth=mb.dataset.month?+mb.dataset.month:null; renderSongs(); }
  const gt=e.target.closest("button[data-gtoggle]"); if(gt){ groupOpen[gt.dataset.gtoggle]=gt.dataset.open!=="true"; renderSongs(); }
  const sg=e.target.closest("button[data-singer]"); if(sg){ const n=sg.dataset.singer||null; activeSinger=(n===MAIN_SINGER)?null:n; renderSongs(); if(n) $("singerChips").scrollIntoView({block:"nearest",behavior:"smooth"}); } });
$("sq").addEventListener("input",renderSongs); $("ssort").addEventListener("change",renderSongs);
$("sshuffle").onclick=()=>{ if(SONGS.length) playNow(SONGS[Math.floor(Math.random()*SONGS.length)]); };
$("playVisible").onclick=()=>{ if(lastVisible.length) playList(lastVisible); };
$("qPrev").onclick=$("mPrev").onclick=()=>step(-1); $("qNext").onclick=$("mNext").onclick=()=>step(1);
$("qShuffle").onclick=shuffleUpcoming; $("qClear").onclick=clearQueue;
$("qRepeat").onclick=()=>{ Q.repeat=!Q.repeat; saveQueue(); renderQueue(); };
$("qToggle").onclick=()=>{ qOpen=!qOpen; renderQueue(); };
$("qFab").onclick=()=>{ if(Q.ids.length) jumpTo(Math.max(0,Math.min(Q.idx,Q.ids.length-1))); };

/* ===== 讀資料：songs.json ===== */
async function loadSongs(){
  const statsReq=fetch("song_stats.json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).catch(()=>null); // 還沒有這個檔也沒關係
  let d=[]; try{ const r=await fetch("songs.json",{cache:"no-cache"}); if(r.ok) d=await r.json(); }catch(e){ console.warn("songs.json load failed（格式可能有誤）",e); }
  STATS=await statsReq;
  const arr=Array.isArray(d)?d:(d.songs||[]);
  SONGS=arr.map((x,i)=>{ if(!x||!x.title) return null; const p=parseClipUrl(x.url||""); if(!p||p.src!=="youtube") return null;
    let start=parseTime(x.start); const end=parseTime(x.end); if(start==null&&p.t!=null) start=p.t;
    return {id:"s"+hash(p.vid+"|"+(start??"")+"|"+x.title).toString(36),src:"youtube",vid:p.vid,url:p.url,start,end:(end!=null&&start!=null&&end<=start)?null:end,
      title:String(x.title),artist:x.artist?String(x.artist):"",category:normCat(x.category),singers:parseSingers(x.singers),pick:x.pick===true||/^(true|v|y|yes|1|是)$/i.test(String(x.pick??"").trim()),streamDate:x.streamDate?normDate(x.streamDate):null,note:x.note||"",order:i}; }).filter(Boolean);
  songsLoaded=true; loadQueue(); renderSongs(); renderQueue();
}

/* ===== 播放方式（自動／手動），記在瀏覽器裡 ===== */
function setPlayMode(m){ manualPlay=m==="manual"; try{ localStorage.setItem("mela-playmode",manualPlay?"manual":"auto"); }catch(e){}
  document.querySelectorAll("button[data-pm]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.pm===(manualPlay?"manual":"auto"))); updateToggle(); }
document.addEventListener("click",e=>{ const b=e.target.closest("button[data-pm]"); if(b) setPlayMode(b.dataset.pm); });
{ let m=null; try{ m=localStorage.getItem("mela-playmode"); }catch(e){} setPlayMode(m==="manual"?"manual":"auto"); }

setLang(pickLang());
loadSongs();
</script>
