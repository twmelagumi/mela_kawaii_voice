# 編年史：每天台灣時間早上 6 點從 YouTube 抓新的直播／影片，寫進 timeline_auto.json 並 commit。
# 也可以到 GitHub 的 Actions 分頁 → Update timeline → Run workflow 手動執行。
name: Update timeline

on:
  schedule:
    - cron: "0 22 * * *"   # UTC 22:00＝台灣時間每天 06:00（GitHub 排程有時會晚幾分鐘到半小時）
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-timeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch YouTube feed
        env:
          # YouTube Data API 金鑰：repo Settings → Secrets and variables → Actions → YT_API_KEY（沒設也能跑，改用 RSS）
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python scripts/update_timeline.py

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- timeline_auto.json && git ls-files --error-unmatch timeline_auto.json >/dev/null 2>&1; then
            echo "no changes"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timeline_auto.json
          git commit -m "Timeline: auto-update from YouTube"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Actions 推的 commit 有時不會觸發 GitHub Pages 重新部署，這裡手動叫一次（失敗也沒關係）
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
